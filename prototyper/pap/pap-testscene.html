<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pap-testscene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: scenen øverst som et foto af et bord; styringen er papbrikker under (stående) eller oven på (liggende) */
  --desk:#17120e;
  --kraft:#b88d5b;
  --kraft-dark:#76552f;
  --ink:#2a1d12;
  --paper:#efe3c8;
  --accent:#2f8f86;
  --font-ui:"Patrick Hand","Comic Sans MS","Segoe Print",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--paper);font-family:var(--font-ui);display:flex;flex-direction:column;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;flex:1 1 0;min-height:0;background:var(--desk)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#hud{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;font:inherit;font-size:16px;line-height:1;padding:8px 12px 8px 10px;border-radius:999px;border:1.5px solid rgba(239,227,200,.35);background:rgba(23,18,14,.62);color:var(--paper);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chip::before{content:"";width:11px;height:11px;border-radius:50%;border:1.5px solid var(--paper);background:transparent}
.chip[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
#count{margin-left:auto;font-size:19px;padding:5px 12px;border-radius:999px;background:rgba(23,18,14,.62);font-variant-numeric:tabular-nums}
#hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:16px;color:rgba(239,227,200,.82);text-shadow:0 1px 6px #000;pointer-events:none;transition:opacity .6s;padding:0 16px}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px;background:var(--desk);transition:opacity .5s}
#msg.gone{opacity:0;pointer-events:none}
#pad{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px 22px}
.pair{display:flex;gap:14px}
.btn{font:inherit;font-size:24px;color:var(--ink);width:78px;height:78px;border-radius:16px;border:0;cursor:pointer;display:grid;place-items:center;
  background:repeating-linear-gradient(0deg,rgba(60,40,20,.07) 0 2px,transparent 2px 9px),var(--kraft);
  box-shadow:inset 0 0 0 2px rgba(255,235,200,.25),0 6px 0 var(--kraft-dark),0 10px 16px rgba(0,0,0,.55);touch-action:none}
.btn.on{transform:translateY(4px);box-shadow:inset 0 0 0 2px rgba(255,235,200,.25),0 2px 0 var(--kraft-dark),0 4px 8px rgba(0,0,0,.55)}
.btn svg{width:30px;height:30px;fill:var(--ink)}
.btn.wide{width:112px}
@media (orientation:portrait){
  #stage{flex:0 1 auto;height:min(132vw,calc(100% - 150px))}
  #pad{flex:1 1 auto}
}
@media (orientation:landscape){
  #pad{position:absolute;left:0;right:0;bottom:0;pointer-events:none;padding:14px 22px 18px}
  .btn{pointer-events:auto;opacity:.94}
  #hint{bottom:auto;top:52px}
}
@media (orientation:landscape) and (pointer:fine){
  .btn{width:58px;height:58px;font-size:19px;border-radius:13px}.btn.wide{width:84px}.btn svg{width:22px;height:22px}
}
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <button class="chip" id="chipStop" type="button" aria-pressed="true">Stop-motion</button>
    <button class="chip" id="chipDof" type="button" aria-pressed="true">Uskarp baggrund</button>
    <div id="count" aria-live="polite">Stjerner 0/5</div>
  </div>
  <div id="hint">Træk i billedet for at kigge om bag pappet</div>
  <div id="msg">Klipper og maler pap …</div>
</div>
<div id="pad">
  <div class="pair">
    <button class="btn" id="bL" type="button" aria-label="Gå til venstre"><svg viewBox="0 0 24 24"><path d="M16.5 3.5v17L5 12z"/></svg></button>
    <button class="btn" id="bR" type="button" aria-label="Gå til højre"><svg viewBox="0 0 24 24"><path d="M7.5 3.5v17L19 12z"/></svg></button>
  </div>
  <button class="btn wide" id="bJ" type="button">Hop</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';

/* ============ små hjælpere ============ */
const TAU=Math.PI*2, mix=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=rng(20261118);
const R=(a,b)=>b===undefined?rnd()*a:a+rnd()*(b-a);
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(2,Math.round(w));c.height=Math.max(2,Math.round(h));return c};
const grey=v=>{v=Math.round(v);return`rgb(${v},${v},${v})`};
function shade(h,d){const n=parseInt(h.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255,t=d>0?255:0,a=Math.abs(d);return`rgb(${Math.round(mix(r,t,a))},${Math.round(mix(g,t,a))},${Math.round(mix(b,t,a))})`}

const stage=document.getElementById('stage'), msg=document.getElementById('msg');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'})}
catch(e){msg.textContent='Din browser kan ikke vise 3D her (WebGL mangler).';throw e}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
stage.insertBefore(renderer.domElement,stage.firstChild);
const ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const FINE=matchMedia('(pointer:fine)').matches;
function tx(c,srgb){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=ANISO;return t}

/* ============ pap-teksturer (alt er tegnet med kode) ============ */
const KPX=512/12; // kraft-flisen er 12 cm bred
function makeKraft(){
  const S=512,c=cv(S,S),g=c.getContext('2d'),b=cv(S,S),h=b.getContext('2d');
  g.fillStyle='#b98e5c';g.fillRect(0,0,S,S);
  for(let y=0;y<S;y++){h.fillStyle=grey(128+16*Math.cos(y/32*TAU));h.fillRect(0,y,S,1)}
  for(let i=0;i<70;i++){const x=R(S),y=R(S),r=R(30,120),dark=rnd()<.5;
    for(const ox of[-S,0,S])for(const oy of[-S,0,S]){if(x+ox+r<0||x+ox-r>S||y+oy+r<0||y+oy-r>S)continue;
      const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);gr.addColorStop(0,dark?'rgba(118,82,44,.11)':'rgba(226,192,144,.11)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x+ox-r,y+oy-r,2*r,2*r)}}
  for(let k=0;k<16;k++){const y=k*32;const gr=g.createLinearGradient(0,y-9,0,y+9);gr.addColorStop(0,'rgba(70,45,20,0)');gr.addColorStop(.5,'rgba(70,45,20,.085)');gr.addColorStop(1,'rgba(70,45,20,0)');g.fillStyle=gr;g.fillRect(0,y-9,S,18);if(k===0)g.fillRect(0,S-9,S,9);
    const y2=y+16,g2=g.createLinearGradient(0,y2-9,0,y2+9);g2.addColorStop(0,'rgba(240,212,170,0)');g2.addColorStop(.5,'rgba(240,212,170,.07)');g2.addColorStop(1,'rgba(240,212,170,0)');g.fillStyle=g2;g.fillRect(0,y2-9,S,18)}
  g.lineCap='round';h.lineCap='round';
  for(let i=0;i<3200;i++){const x=R(S),y=R(S),a=R(TAU),l=R(4,15),dx=Math.cos(a)*l,dy=Math.sin(a)*l*.6,light=rnd()<.5;
    g.strokeStyle=light?'rgba(228,198,152,1)':'rgba(120,84,46,1)';g.globalAlpha=R(.07,.2);g.lineWidth=R(.5,1.3);
    for(const ox of[-S,0,S])for(const oy of[-S,0,S]){const X=x+ox,Y=y+oy;if(X<-20||X>S+20||Y<-20||Y>S+20)continue;g.beginPath();g.moveTo(X,Y);g.lineTo(X+dx,Y+dy);g.stroke();
      if(i%3===0){h.strokeStyle=light?'#a8a8a8':'#606060';h.globalAlpha=.3;h.lineWidth=1;h.beginPath();h.moveTo(X,Y);h.lineTo(X+dx,Y+dy);h.stroke()}}}
  g.globalAlpha=1;h.globalAlpha=1;
  const id=g.getImageData(0,0,S,S),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*15;d[i]+=n;d[i+1]+=n;d[i+2]+=n*.8}g.putImageData(id,0,0);
  return{c,b}}
function makeEdge(){
  const W=256,H=64,c=cv(W,H),g=c.getContext('2d');g.fillStyle='#7b5b38';g.fillRect(0,0,W,H);
  g.strokeStyle='#c4a06d';g.lineWidth=7;g.lineJoin='round';g.beginPath();for(let x=-8;x<=W+8;x+=2){const y=32+18*Math.sin(x/64*TAU);x===-8?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
  g.fillStyle='#cba873';g.fillRect(0,0,W,11);g.fillRect(0,H-11,W,11);g.fillStyle='rgba(50,32,14,.4)';g.fillRect(0,11,W,1.5);g.fillRect(0,H-12.5,W,1.5);
  const id=g.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*18;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);return c}
function makeMat(){
  const S=512,c=cv(S,S),g=c.getContext('2d');g.fillStyle='#285a4b';g.fillRect(0,0,S,S);
  const id=g.getImageData(0,0,S,S),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*10;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);
  const px=S/10;for(let i=0;i<=10;i++){const p=Math.round(i*px);g.fillStyle=i%10===0?'rgba(214,236,222,.5)':i%5===0?'rgba(214,236,222,.36)':'rgba(214,236,222,.17)';const w=i%10===0?2.4:i%5===0?1.6:1;g.fillRect(p-w/2,0,w,S);g.fillRect(0,p-w/2,S,w)}
  g.fillStyle='rgba(214,236,222,.17)';g.fillRect(S-1.2,0,1.2,S);g.fillRect(0,S-1.2,S,1.2);
  g.lineCap='round';for(let i=0;i<26;i++){const x=R(S),y=R(S),a=R(TAU),l=R(20,150);g.strokeStyle=rnd()<.6?'rgba(190,225,205,.16)':'rgba(10,30,24,.25)';g.lineWidth=R(.5,1.2);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  return c}
function makeTape(){
  const W=160,H=56,c=cv(W,H),g=c.getContext('2d');g.fillStyle='rgba(233,220,176,.93)';g.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){g.fillStyle=rnd()<.5?'rgba(255,248,220,.12)':'rgba(150,130,80,.1)';g.fillRect(0,R(H),W,R(.5,1.5))}
  g.globalCompositeOperation='destination-out';g.fillStyle='#000';
  for(const side of[0,1]){g.beginPath();const x0=side?W:0,s=side?-1:1;g.moveTo(x0,0);for(let y=0;y<=H;y+=4)g.lineTo(x0+s*R(1,7),y);g.lineTo(x0,H);g.closePath();g.fill()}
  return c}
function makeEnv(){
  const c=cv(256,128),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,128);gr.addColorStop(0,'#f3e6cf');gr.addColorStop(.35,'#8f7a62');gr.addColorStop(.6,'#3a3028');gr.addColorStop(1,'#141110');g.fillStyle=gr;g.fillRect(0,0,256,128);
  g.fillStyle='#fffaf0';g.fillRect(40,14,46,26);g.fillRect(170,8,30,20);g.fillStyle='#cfe0f2';g.fillRect(110,22,28,14);return c}

const KR=makeKraft();
const M={};
{const km=tx(KR.c,true),kb=tx(KR.b,false);km.wrapS=km.wrapT=kb.wrapS=kb.wrapT=THREE.RepeatWrapping;
 M.kraft=new THREE.MeshStandardMaterial({map:km,bumpMap:kb,bumpScale:1.4,roughness:.95});
 const em=tx(makeEdge(),true);em.wrapS=THREE.RepeatWrapping;M.edge=new THREE.MeshStandardMaterial({map:em,roughness:.95});
 M.edgeSoft=new THREE.MeshStandardMaterial({color:'#c8a574',roughness:.95});
 M.brass=new THREE.MeshStandardMaterial({color:'#c9a04a',metalness:1,roughness:.32});
 M.wood=new THREE.MeshStandardMaterial({color:'#d9bb8c',roughness:.75});
 M.thread=new THREE.MeshStandardMaterial({color:'#e9e4d8',roughness:.9});
 M.tape=new THREE.MeshStandardMaterial({map:tx(makeTape(),true),transparent:true,roughness:.62})}

/* ============ omrids: klippet i hånden ============ */
function catmull(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t,f=(a,b,c,d)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);return[f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]}
function wobble(pts,amp){if(!amp)return pts;const n=pts.length,f1=R(.9,1.6),f2=R(2.4,3.6),a1=R(TAU),a2=R(TAU),out=[];let s=0;
  for(let i=0;i<n;i++){const a=pts[(i-1+n)%n],b=pts[i],c=pts[(i+1)%n];let tx_=c[0]-a[0],ty=c[1]-a[1];const l=Math.hypot(tx_,ty)||1;tx_/=l;ty/=l;s+=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const d=amp*(Math.sin(s*f1+a1)*.6+Math.sin(s*f2+a2)*.4);out.push([b[0]+ty*d,b[1]-tx_*d])}return out}
function ccw(pts){let A=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];A+=a[0]*b[1]-b[0]*a[1]}return A<0?pts.slice().reverse():pts}
function dedupe(pts){return pts.filter((p,i)=>{const q=pts[(i+1)%pts.length];return Math.hypot(p[0]-q[0],p[1]-q[1])>1e-3})}
/* cp: [x,y] = blød kurve gennem punktet, [x,y,1] = skarpt hjørne */
function outline(cp,seg=7,amp=.035){const n=cp.length,out=[];
  for(let i=0;i<n;i++){const p1=cp[i],p2=cp[(i+1)%n];
    if(p1[2]&&p2[2]){const len=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]),k=Math.max(1,Math.round(len/1.2));for(let j=0;j<k;j++)out.push([mix(p1[0],p2[0],j/k),mix(p1[1],p2[1],j/k)]);continue}
    const p0=p1[2]?p1:cp[(i-1+n)%n],p3=p2[2]?p2:cp[(i+2)%n];for(let k=0;k<seg;k++)out.push(catmull(p0,p1,p2,p3,k/seg))}
  return ccw(dedupe(wobble(out,amp)))}
function curve(cp,seg=6){const o=[];for(let i=0;i<cp.length-1;i++){const p0=cp[Math.max(0,i-1)],p3=cp[Math.min(cp.length-1,i+2)];for(let k=0;k<seg;k++)o.push(catmull(p0,cp[i],cp[i+1],p3,k/seg))}o.push(cp[cp.length-1]);return o}
function ell(x,y,rx,ry,n=14,j=.08){const o=[];for(let i=0;i<n;i++){const a=i/n*TAU,k=1+R(-j,j);o.push([x+Math.cos(a)*rx*k,y+Math.sin(a)*ry*k])}return o}
const rect=(x0,y0,x1,y1)=>[[x0,y0,1],[x1,y0,1],[x1,y1,1],[x0,y1,1]];

/* ============ maleren: pensel, tusch og blyant på et stykke pap ============ */
const SCR=[cv(2,2),cv(2,2)];
function scratch(i,w,h){const c=SCR[i];c.width=w;c.height=h;return c}
function wpts(x0,y0,x1,y1,wob){const len=Math.hypot(x1-x0,y1-y0)||1,n=Math.max(2,Math.ceil(len/18)),nx=-(y1-y0)/len,ny=(x1-x0)/len,p=R(TAU),f=R(.008,.02),o=[];for(let i=0;i<=n;i++){const t=i/n,d=Math.sin(t*len*f+p)*wob;o.push(mix(x0,x1,t)+nx*d,mix(y0,y1,t)+ny*d)}return o}
function sp(ctx,o){ctx.beginPath();ctx.moveTo(o[0],o[1]);for(let i=2;i<o.length;i+=2)ctx.lineTo(o[i],o[i+1]);ctx.stroke()}
class Painter{
  constructor(pts,s,opt={}){
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;for(const[x,y]of pts){minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}
    const W=maxx-minx,H=maxy-miny;s=Math.min(s,(opt.cap||1536)/Math.max(W,H));
    Object.assign(this,{minx,miny,maxx,maxy,W,H,s,noBump:!!opt.noBump});
    this.c=cv(W*s,H*s);this.w=this.c.width;this.h=this.c.height;this.g=this.c.getContext('2d');
    this.b=this.noBump?null:cv(this.w,this.h);this.hc=this.b?this.b.getContext('2d'):null;
    const k=s/KPX,fill=(ctx,img)=>{const ox=R(512),oy=R(512);ctx.save();ctx.scale(k,k);ctx.translate(-ox,-oy);ctx.fillStyle=ctx.createPattern(img,'repeat');ctx.fillRect(ox,oy,this.w/k+2,this.h/k+2);ctx.restore()};
    fill(this.g,KR.c);if(this.hc)fill(this.hc,KR.b)}
  X(x){return(x-this.minx)*this.s}Y(y){return(this.maxy-y)*this.s}
  path(ctx,pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(this.X(p[0]),this.Y(p[1])):ctx.moveTo(this.X(p[0]),this.Y(p[1])));ctx.closePath()}
  /* et lag maling med synlige penselstrøg og tørre striber, hvor pappet skinner igennem */
  coat(color,region,o={}){
    const{dir=0,vary=.07,gaps=1,bw=.5,alpha=.96}=o,{w,h,s,g}=this;
    const L=scratch(0,w,h),l=L.getContext('2d');let hb=null,HB=null;
    if(this.hc){HB=scratch(1,w,h);hb=HB.getContext('2d');hb.fillStyle='#8e8e8e';hb.fillRect(0,0,w,h);hb.lineCap='round'}
    l.globalAlpha=alpha;l.fillStyle=color;l.fillRect(0,0,w,h);l.lineCap='round';
    const diag=Math.hypot(w,h),bwp=Math.max(3,bw*s),n=Math.ceil(diag/bwp*1.5),cx=w/2,cy=h/2;
    const seg=(off,st,len,a,wob)=>{const dx=Math.cos(a),dy=Math.sin(a),x0=cx+dx*st-dy*off,y0=cy+dy*st+dx*off;return wpts(x0,y0,x0+dx*len,y0+dy*len,wob)};
    for(let i=0;i<n;i++){const p=seg((i/n-.5)*diag+R(-.4,.4)*bwp,R(-.6,.05)*diag,R(.35,.95)*diag,dir+R(-.05,.05),bwp*.3),lw=bwp*R(.7,1.3);
      l.strokeStyle=shade(color,R(-vary,vary));l.globalAlpha=R(.35,.75);l.lineWidth=lw;sp(l,p);
      if(hb){hb.strokeStyle=grey(R(100,185));hb.globalAlpha=.6;hb.lineWidth=lw;sp(hb,p)}}
    const fine=Math.max(.6,s/40);
    for(let i=0;i<n*9;i++){const p=seg(R(-.5,.5)*diag,R(-.6,.5)*diag,R(.06,.35)*diag,dir+R(-.04,.04),bwp*.12),lw=R(.6,1.8)*fine;
      l.strokeStyle=shade(color,R(-.17,.15));l.globalAlpha=R(.06,.2);l.lineWidth=lw;sp(l,p);
      if(hb){hb.strokeStyle=rnd()<.5?'#cdcdcd':'#555';hb.globalAlpha=.3;hb.lineWidth=lw;sp(hb,p)}}
    l.globalCompositeOperation='destination-out';l.strokeStyle='#000';
    for(let i=0;i<n*3*gaps;i++){const p=seg(R(-.5,.5)*diag,R(-.55,.5)*diag,R(.03,.14)*diag,dir+R(-.04,.04),bwp*.1);l.globalAlpha=R(.2,.7);l.lineWidth=R(.5,2.4)*fine;sp(l,p)}
    l.globalCompositeOperation='source-over';l.globalAlpha=1;
    g.save();if(region){this.path(g,region);g.clip()}g.drawImage(L,0,0);g.restore();
    if(hb){const hc=this.hc;hc.save();if(region){this.path(hc,region);hc.clip()}hc.globalAlpha=.9;hc.drawImage(HB,0,0);hc.restore()}}
  fill(region,color,alpha=.96){const g=this.g;g.save();g.globalAlpha=alpha;g.fillStyle=color;this.path(g,region);g.fill();g.restore();
