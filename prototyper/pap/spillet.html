<style>

  --desk:#0d0a12;

}
html,body{height:100%;margin:0}

[hidden]{display:none!important}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';
const msgN=document.getElementById('msgN');
/* ============ små hjælpere ============ */
const TAU=Math.PI*2, mix=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=rng(20261118);
const R=(a,b)=>b===undefined?rnd()*a:a+rnd()*(b-a);
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(2,Math.round(w));c.height=Math.max(2,Math.round(h));return c};
const grey=v=>{v=Math.round(v);return`rgb(${v},${v},${v})`};
function shade(h,d){const n=parseInt(h.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255,t=d>0?255:0,a=Math.abs(d);return`rgb(${Math.round(mix(r,t,a))},${Math.round(mix(g,t,a))},${Math.round(mix(b,t,a))})`}

const stage=document.getElementById('stage'), msg=document.getElementById('msg');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'})}
catch(e){msg.textContent='Din browser kan ikke vise 3D her (WebGL mangler).';throw e}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
stage.insertBefore(renderer.domElement,stage.firstChild);
const ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const FINE=matchMedia('(pointer:fine)').matches;
function tx(c,srgb){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=ANISO;return t}

/* ============ pap-teksturer (alt er tegnet med kode) ============ */
const KPX=512/12; // kraft-flisen er 12 cm bred
function makeKraft(){
  const S=512,c=cv(S,S),g=c.getContext('2d'),b=cv(S,S),h=b.getContext('2d');
  g.fillStyle='#b98e5c';g.fillRect(0,0,S,S);
  for(let y=0;y<S;y++){h.fillStyle=grey(128+16*Math.cos(y/32*TAU));h.fillRect(0,y,S,1)}
  for(let i=0;i<70;i++){const x=R(S),y=R(S),r=R(30,120),dark=rnd()<.5;
    for(const ox of[-S,0,S])for(const oy of[-S,0,S]){if(x+ox+r<0||x+ox-r>S||y+oy+r<0||y+oy-r>S)continue;
      const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);gr.addColorStop(0,dark?'rgba(118,82,44,.11)':'rgba(226,192,144,.11)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x+ox-r,y+oy-r,2*r,2*r)}}
  for(let k=0;k<16;k++){const y=k*32;const gr=g.createLinearGradient(0,y-9,0,y+9);gr.addColorStop(0,'rgba(70,45,20,0)');gr.addColorStop(.5,'rgba(70,45,20,.085)');gr.addColorStop(1,'rgba(70,45,20,0)');g.fillStyle=gr;g.fillRect(0,y-9,S,18);if(k===0)g.fillRect(0,S-9,S,9);
    const y2=y+16,g2=g.createLinearGradient(0,y2-9,0,y2+9);g2.addColorStop(0,'rgba(240,212,170,0)');g2.addColorStop(.5,'rgba(240,212,170,.07)');g2.addColorStop(1,'rgba(240,212,170,0)');g.fillStyle=g2;g.fillRect(0,y2-9,S,18)}
  g.lineCap='round';h.lineCap='round';
  for(let i=0;i<3200;i++){const x=R(S),y=R(S),a=R(TAU),l=R(4,15),dx=Math.cos(a)*l,dy=Math.sin(a)*l*.6,light=rnd()<.5;
    g.strokeStyle=light?'rgba(228,198,152,1)':'rgba(120,84,46,1)';g.globalAlpha=R(.07,.2);g.lineWidth=R(.5,1.3);
    for(const ox of[-S,0,S])for(const oy of[-S,0,S]){const X=x+ox,Y=y+oy;if(X<-20||X>S+20||Y<-20||Y>S+20)continue;g.beginPath();g.moveTo(X,Y);g.lineTo(X+dx,Y+dy);g.stroke();
      if(i%3===0){h.strokeStyle=light?'#a8a8a8':'#606060';h.globalAlpha=.3;h.lineWidth=1;h.beginPath();h.moveTo(X,Y);h.lineTo(X+dx,Y+dy);h.stroke()}}}
  g.globalAlpha=1;h.globalAlpha=1;
  const id=g.getImageData(0,0,S,S),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*15;d[i]+=n;d[i+1]+=n;d[i+2]+=n*.8}g.putImageData(id,0,0);
  return{c,b}}
function makeEdge(){
  const W=256,H=64,c=cv(W,H),g=c.getContext('2d');g.fillStyle='#7b5b38';g.fillRect(0,0,W,H);
  g.strokeStyle='#c4a06d';g.lineWidth=7;g.lineJoin='round';g.beginPath();for(let x=-8;x<=W+8;x+=2){const y=32+18*Math.sin(x/64*TAU);x===-8?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
  g.fillStyle='#cba873';g.fillRect(0,0,W,11);g.fillRect(0,H-11,W,11);g.fillStyle='rgba(50,32,14,.4)';g.fillRect(0,11,W,1.5);g.fillRect(0,H-12.5,W,1.5);
  const id=g.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*18;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);return c}
function makeMat(){

  if(o.shutter)for(const s of[-1,1]){const sx=x+s*(w/2+w*.28);P.fill(outline(rect(sx-w*.25,y,sx+w*.25,y+top),1,.01),o.shutter,.95);for(let yy=y+.35;yy<y+top-.2;yy+=.45)P.line([[sx-w*.2,yy],[sx+w*.2,yy]],shade(o.shutter,-.3),.04,.7)}
  if(o.box){P.fill(outline(rect(x-w/2-.1,y-1.1,x+w/2+.1,y-.3),1,.01),'#6b4428',.97);for(let k=0;k<7;k++)P.fill(ell(x-w/2+.3+k*(w-.6)/6,y-.15+R(-.1,.2),.32,.3,8,.1),k%2?'#e05a8a':'#f2c230',.95);P.dabs('#4f8a3a',14,{x0:x-w/2,x1:x+w/2,y0:y-.4,y1:y+.1,len:.35,w:.08,dir:1.57,spread:.6,alpha:.8})}}
/* tagsten i rækker med buede kanter */
function shingles(P,region,col,rowH=.9,tile=1.1){P.coat(col,region,{dir:0,bw:.4});const{minx,maxx,miny,maxy}=P;const g=P.g;g.save();if(region){P.path(g,region);g.clip()}
  for(let y=miny,r=0;y<maxy;y+=rowH,r++){for(let x=minx+(r%2?tile/2:0);x<maxx;x+=tile){const arc=[];for(let k=0;k<=6;k++){const a=Math.PI+k/6*Math.PI;arc.push([x+tile/2+Math.cos(a)*tile/2,y+rowH*.95+Math.sin(a)*rowH*.55])}P.line(arc,shade(col,-.35),.06,.75);if(rnd()<.18)P.fill(outline(rect(x+.1,y+.1,x+tile-.1,y+rowH*.8),1,.01),shade(col,R(-.12,.12)),.5)}}
  g.restore()}

function bricks(P,region,col,bw=1.6,bh=.7){P.coat(col,region,{dir:0,bw:.5});const{minx,maxx,miny,maxy}=P;const g=P.g;g.save();if(region){P.path(g,region);g.clip()}
  for(let y=miny,r=0;y<maxy;y+=bh,r++){P.line([[minx,y],[maxx,y]],shade(col,-.3),.05,.55);for(let x=minx+(r%2?bw/2:0);x<maxx;x+=bw){P.line([[x,y],[x,y+bh]],shade(col,-.3),.045,.5);if(rnd()<.25)P.fill(outline(rect(x+.06,y+.06,x+bw-.06,y+bh-.06),1,.005),shade(col,R(-.15,.12)),.45)}}

  for(let i=0;i<n;i++){const x=R(minx,maxx),y=R(miny,maxy),r=size*R(.6,1.1),e=ell(x,y,r,r*R(.6,.85),9,.12);P.fill(e,shade(col,R(-.12,.15)),.97);P.line([...e,e[0]],shade(col,-.45),.05,.6);P.line(e.slice(1,4),shade(col,.35),.05,.5)}g.restore()}
/* dør med planker, bue, beslag og håndtag */
function door(P,x,y,w,h,col,o={}){const top=h-w/2,sh=outline([[x-w/2,y,1],[x+w/2,y,1],[x+w/2,y+top],[x+w*.35,y+h-w*.08],[x,y+h],[x-w*.35,y+h-w*.08],[x-w/2,y+top]],4,.01);
  P.fill(sh,BLK,.97);const ins=outline([[x-w/2+.25,y,1],[x+w/2-.25,y,1],[x+w/2-.25,y+top],[x+w*.32,y+h-w*.1-.25],[x,y+h-.25],[x-w*.32,y+h-w*.1-.25],[x-w/2+.25,y+top]],4,.01);
  P.coat(col,ins,{dir:1.57,bw:.25});for(let xx=x-w/2+w/4;xx<x+w/2-.2;xx+=w/4)P.line([[xx,y],[xx,y+h-.4]],shade(col,-.35),.06,.8);
  if(!o.noIron)for(const yy of[y+h*.25,y+h*.6])P.line([[x-w/2+.3,yy],[x+w/2-.3,yy]],'#3a3a44',.12,.85);
  P.fill(ell(x+w*.3,y+h*.42,.18,.18,8,.05),'#e9b949',.97)}

/* et skilt: plade med kant og bygningens egen skrift */
function sign(text,font,w,h,bg,fg,o={}){return makeCard(outline(o.shape||rect(-w/2,0,w/2,h),o.shape?6:1,.015),{t:.35,s:46,paint:P=>{

  P.text(text,0,h/2+(o.dy||0),o.size||h*.55,fg,{font,ls:o.ls,gold:o.gold,stroke:o.stroke,sw:o.sw,shadow:o.shadow});

/* ============ håndværket: papirtyper, præcise snit, lag og huller ============
   Alt nyt bygges af "stykker": et præcist udskåret stykke papir/karton med tykkelse,
   evt. med huller (vinduer), og med et fælles papirmateriale, så intet skal males pr. stykke. */
const CL=ClipperLib,CS=1000;
const toC=pts=>pts.map(p=>({X:Math.round(p[0]*CS),Y:Math.round(p[1]*CS)}));
const fromC=path=>path.map(p=>[p.X/CS,p.Y/CS]);
function treeShapes(tree){const out=[];const walk=n=>{for(const ch of n.Childs()){if(ch.IsHole())continue;out.push({outer:fromC(ch.Contour()),holes:ch.Childs().map(h=>fromC(h.Contour()))});for(const h of ch.Childs())walk(h)}};walk(tree);return out}
function clip(subj,clp,type){const c=new CL.Clipper();c.AddPaths(subj.map(toC),CL.PolyType.ptSubject,true);if(clp&&clp.length)c.AddPaths(clp.map(toC),CL.PolyType.ptClip,true);
  const tree=new CL.PolyTree();c.Execute({union:CL.ClipType.ctUnion,inter:CL.ClipType.ctIntersection,diff:CL.ClipType.ctDifference}[type],tree,CL.PolyFillType.pftNonZero,CL.PolyFillType.pftNonZero);return treeShapes(tree)}
/* tykke linjer med runde led og ender (stier), og en form gjort større/mindre */
function thick(lines,w){const co=new CL.ClipperOffset(2,CS*.02);for(const l of lines)co.AddPath(toC(l),CL.JoinType.jtRound,CL.EndType.etOpenRound);const tree=new CL.PolyTree();co.Execute(tree,w*CS);return treeShapes(tree)}
function grow(pts,d,round=true){const co=new CL.ClipperOffset(2,CS*.02);co.AddPath(toC(pts),round?CL.JoinType.jtRound:CL.JoinType.jtMiter,CL.EndType.etClosedPolygon);const tree=new CL.PolyTree();co.Execute(tree,d*CS);return treeShapes(tree)}
const ring=(pts,d,round)=>clip(grow(pts,d,round).map(s=>s.outer),[pts],'diff');

/* præcise former */
const box=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
function arch(cx,y0,w,h,n=18){const r=w/2,yc=y0+h-r,o=[[cx-r,y0],[cx+r,y0],[cx+r,yc]];for(let i=1;i<n;i++){const a=i/n*Math.PI;o.push([cx+Math.cos(a)*r,yc+Math.sin(a)*r])}o.push([cx-r,yc]);return o}
function circ(cx,cy,rx,ry=rx,n=40){const o=[];for(let i=0;i<n;i++){const a=i/n*TAU;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return o}
function wedge(cx,cy,r0,r1,a0,a1,n=6){const o=[];for(let i=0;i<=n;i++){const a=mix(a0,a1,i/n);o.push([cx+Math.cos(a)*r1,cy+Math.sin(a)*r1])}for(let i=n;i>=0;i--){const a=mix(a0,a1,i/n);o.push([cx+Math.cos(a)*r0,cy+Math.sin(a)*r0])}return o}
const area=p=>{let A=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];A+=a[0]*b[1]-b[0]*a[1]}return A/2};
const toCCW=p=>area(p)<0?p.slice().reverse():p,toCW=p=>area(p)>0?p.slice().reverse():p;

/* farver */
function rgbOf(c){if(c[0]==='#'){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}const m=c.match(/[\d.]+/g).map(Number);return m.slice(0,3)}
const rgba=(c,a)=>{const[r,g,b]=rgbOf(c);return`rgba(${r},${g},${b},${a})`};
const hexOf=c=>{const[r,g,b]=rgbOf(c);return'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')};

/* ---- papirtyperne: sømløse fliser, tegnet én gang ---- */
function paperTile({tone=[244,240,232],mottle=7,fibers=1600,flen=[4,14],falpha=[.04,.1],noise=7,dots=0,dotR=[2,5],bumpFib=.25,gravel=0,S=512}){
  const c=cv(S,S),g=c.getContext('2d'),b=cv(S,S),h=b.getContext('2d');
  g.fillStyle=`rgb(${tone})`;g.fillRect(0,0,S,S);h.fillStyle='#808080';h.fillRect(0,0,S,S);
  const wrap=(x,y,r,f)=>{for(const ox of[-S,0,S])for(const oy of[-S,0,S]){if(x+ox+r<0||x+ox-r>S||y+oy+r<0||y+oy-r>S)continue;f(x+ox,y+oy)}};
  for(let i=0;i<60;i++){const x=R(S),y=R(S),r=R(40,140),d=rnd()<.5;wrap(x,y,r,(X,Y)=>{const gr=g.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,d?`rgba(90,70,50,${mottle/255})`:`rgba(255,255,255,${mottle/255})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(X-r,Y-r,2*r,2*r)})}
  for(let i=0;i<dots;i++){const x=R(S),y=R(S),r=R(...dotR),up=rnd()<.55;wrap(x,y,r,(X,Y)=>{const gr=h.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,up?'rgba(255,255,255,.45)':'rgba(0,0,0,.4)');gr.addColorStop(1,'rgba(128,128,128,0)');h.fillStyle=gr;h.fillRect(X-r,Y-r,2*r,2*r)})}
  for(let i=0;i<gravel;i++){const x=R(S),y=R(S),r=R(1,3.2),v=R(-50,40);wrap(x,y,r+2,(X,Y)=>{g.fillStyle=`rgba(${v<0?'70,55,40':'255,250,235'},${Math.abs(v)/160})`;g.beginPath();g.ellipse(X,Y,r,r*R(.6,1),R(3),0,TAU);g.fill();h.fillStyle='rgba(255,255,255,.5)';h.beginPath();h.ellipse(X,Y,r,r*.8,0,0,TAU);h.fill();h.fillStyle='rgba(0,0,0,.35)';h.beginPath();h.ellipse(X+r*.5,Y+r*.6,r*.8,r*.5,0,0,TAU);h.fill()})}
  g.lineCap=h.lineCap='round';
  for(let i=0;i<fibers;i++){const x=R(S),y=R(S),a=R(TAU),l=R(...flen),dx=Math.cos(a)*l,dy=Math.sin(a)*l,light=rnd()<.5;
    wrap(x,y,l,(X,Y)=>{g.strokeStyle=light?'rgba(255,255,255,1)':'rgba(110,90,70,1)';g.globalAlpha=R(...falpha);g.lineWidth=R(.5,1.2);g.beginPath();g.moveTo(X,Y);g.quadraticCurveTo(X+dx*.5+R(-2,2),Y+dy*.5+R(-2,2),X+dx,Y+dy);g.stroke();
      h.strokeStyle=light?'#fff':'#000';h.globalAlpha=bumpFib*R(.3,1);h.lineWidth=1;h.beginPath();h.moveTo(X,Y);h.lineTo(X+dx,Y+dy);h.stroke()})}
  g.globalAlpha=h.globalAlpha=1;
  const id=g.getImageData(0,0,S,S),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*noise;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);
  return{c,b}}
const PAPER={};
function makePapers(){if(PAPER.card)return;
  PAPER.card={...paperTile({tone:[246,243,236],mottle:5,fibers:1400,falpha:[.03,.08],noise:6,bumpFib:.2}),k:1/14,bs:.5};
  PAPER.water={...paperTile({tone:[248,245,238],mottle:8,fibers:900,falpha:[.03,.07],noise:6,dots:1700,dotR:[2,6],bumpFib:.15}),k:1/12,bs:1.1};
  PAPER.tissue={...paperTile({tone:[252,248,238],mottle:26,fibers:700,flen:[18,60],falpha:[.08,.2],noise:10,bumpFib:.1}),k:1/9,bs:.2};
  PAPER.sand={...paperTile({tone:[238,226,200],mottle:10,fibers:600,falpha:[.03,.07],noise:8,gravel:900,bumpFib:.15}),k:1/10,bs:.9};
  PAPER.kraft={c:KR.c,b:KR.b,k:1/12,bs:1.2};
  /* balsatræ med årer */
  {const S=256,c=cv(S,S),g=c.getContext('2d');g.fillStyle='#e8d2a6';g.fillRect(0,0,S,S);for(let i=0;i<90;i++){const y=R(S),a=R(.04,.16);g.strokeStyle=rnd()<.6?`rgba(150,105,60,${a})`:`rgba(255,240,210,${a})`;g.lineWidth=R(.6,2.4);g.beginPath();g.moveTo(0,y);for(let x=0;x<=S;x+=16)g.lineTo(x,y+Math.sin(x/S*TAU*2+i)*2);g.stroke()}
   PAPER.balsa={c,b:c,k:1/6,bs:.3}}
  /* pigmentkorn til akvarellen: hvidt med små mørke prikker */
  {const S=256,c=cv(S,S),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S,S);for(let i=0;i<2600;i++){g.fillStyle=`rgba(60,40,70,${R(.05,.22)})`;g.beginPath();g.arc(R(S),R(S),R(.4,1.4),0,TAU);g.fill()}PAPER.gran={c}}
  for(const k in PAPER){if(k==='gran')continue;const p=PAPER[k];p.tex=tx(p.c,true);p.tex.wrapS=p.tex.wrapT=THREE.RepeatWrapping;p.btex=tx(p.b,false);p.btex.wrapS=p.btex.wrapT=THREE.RepeatWrapping}}
const MATS=new Map();
function paperMat(color,kind='card',o={}){const key=color+kind+JSON.stringify(o);if(MATS.has(key))return MATS.get(key);makePapers();const p=PAPER[kind];
  const m=new THREE.MeshStandardMaterial({color:new THREE.Color(hexOf(color)),map:p.tex,bumpMap:p.btex,bumpScale:p.bs,roughness:o.rough??.9,metalness:o.metal??0});
  if(o.glow){m.emissive=new THREE.Color(o.glow);m.emissiveMap=p.tex;m.emissiveIntensity=o.gi??1.6}
  if(o.env)m.envMapIntensity=o.env;MATS.set(key,m);return m}
/* guldfolie og den farvede kerne i kanten af et snit */
const gold=()=>paperMat('#e0b964','card',{metal:.85,rough:.33,env:3.2});
const coreOf=(c,kind)=>kind==='water'||kind==='tissue'?'#efe7d8':kind==='kraft'?'#b08a5a':hexOf(shade(hexOf(c),.1));

/* ---- geometri: en plade med tykkelse og huller; papiret ligger i verdens-målestok ---- */
function slabGeo(outer,holes,t,uv){
  outer=toCCW(outer);holes=(holes||[]).map(toCW);const loops=[outer,...holes];
  const tris=THREE.ShapeUtils.triangulateShape(outer.map(p=>new THREE.Vector2(p[0],p[1])),holes.map(h=>h.map(p=>new THREE.Vector2(p[0],p[1]))));
  const flat=[].concat(...loops),n=flat.length,pos=[],nor=[],uvs=[],fi=[],bi=[],si=[];
  for(const p of flat){pos.push(p[0],p[1],t/2);nor.push(0,0,1);uvs.push(...uv(p[0],p[1]))}
  for(const p of flat){pos.push(p[0],p[1],-t/2);nor.push(0,0,-1);uvs.push(...uv(p[0],p[1]))}
  for(let[a,b,c]of tris){const A=flat[a],B=flat[b],C=flat[c];if((B[0]-A[0])*(C[1]-A[1])-(B[1]-A[1])*(C[0]-A[0])<0)[b,c]=[c,b];fi.push(a,b,c);bi.push(n+a,n+c,n+b)}
  let v=2*n;for(const L of loops){let acc=0;for(let i=0;i<L.length;i++){const a=L[i],b=L[(i+1)%L.length],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1e-6,nx=dy/len,ny=-dx/len;
    pos.push(a[0],a[1],t/2,b[0],b[1],t/2,b[0],b[1],-t/2,a[0],a[1],-t/2);for(let k=0;k<4;k++)nor.push(nx,ny,0);uvs.push(acc/3,1,(acc+len)/3,1,(acc+len)/3,0,acc/3,0);acc+=len;si.push(v,v+3,v+2,v,v+2,v+1);v+=4}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex([...fi,...bi,...si]);g.addGroup(0,fi.length,0);g.addGroup(fi.length,bi.length,1);g.addGroup(fi.length+bi.length,si.length,2);return g}

/* maleren på rigtigt papir: akvarel-lag, ridsede fuger og en fin pen */
class Painter2 extends Painter{
  constructor(pts,s,opt={}){super(pts,s,Object.assign({},opt,{noBump:false}));makePapers();const B=PAPER[opt.base||'water'];
    const k=this.s/(B.k*B.c.width),fill=(ctx,img)=>{ctx.save();ctx.globalAlpha=1;ctx.scale(k,k);ctx.fillStyle=ctx.createPattern(img,'repeat');ctx.fillRect(0,0,this.w/k+2,this.h/k+2);ctx.restore()};
    fill(this.g,B.c);fill(this.hc,B.b)}
  clipTo(ctx,region){if(region){this.path(ctx,region);ctx.clip()}}
  /* et lag akvarel: gennemsigtig farve, mørkere kant hvor pigmentet samler sig, korn og skyer */
  wash(color,region,{alpha=.92,edge=.55,grain=.3,top=null,clouds=6,blur=.35,mode='multiply'}={}){const{w,h,s,g}=this,L=scratch(0,w,h),l=L.getContext('2d');
    l.clearRect(0,0,w,h);l.save();this.clipTo(l,region);
    if(top){const gr=l.createLinearGradient(0,this.Y(this.maxy),0,this.Y(this.miny));gr.addColorStop(0,top);gr.addColorStop(1,color);l.fillStyle=gr}else l.fillStyle=color;l.fillRect(0,0,w,h);
    for(let i=0;i<clouds;i++){const x=R(w),y=R(h),r=R(.15,.45)*Math.max(w,h),c2=shade(hexOf(color),R(-.14,.1)),gr=l.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(c2,.5));gr.addColorStop(1,rgba(c2,0));l.fillStyle=gr;l.fillRect(x-r,y-r,2*r,2*r)}
    if(grain){l.globalAlpha=grain;l.globalCompositeOperation='multiply';const p=l.createPattern(PAPER.gran.c,'repeat');l.fillStyle=p;l.fillRect(0,0,w,h);l.globalCompositeOperation='source-over';l.globalAlpha=1}
    if(region&&edge){l.globalCompositeOperation='source-atop';l.filter=`blur(${Math.max(1,blur*s*.5)}px)`;l.strokeStyle=shade(hexOf(color),-.3);l.globalAlpha=edge;l.lineWidth=blur*s;this.path(l,region);l.stroke();l.filter='none';l.globalAlpha=1;l.globalCompositeOperation='source-over'}
    l.restore();g.save();g.globalCompositeOperation=mode;g.globalAlpha=alpha;g.drawImage(L,0,0);g.restore()}
  /* en jævn, dækkende farve (farvet karton eller tryk) */
  flat(color,region,alpha=1){const g=this.g;g.save();g.globalAlpha=alpha;g.globalCompositeOperation='multiply';g.fillStyle=color;if(region){this.path(g,region);g.fill()}else g.fillRect(0,0,this.w,this.h);g.restore()}
  /* en ridset fuge: rille i relieffet og en svag mørk streg */
  score(pts,{w=.07,ink=.22,closed=false,dark='#3a2a40'}={}){const{g,hc}=this,lw=Math.max(1,w*this.s),P=pts.map(p=>[this.X(p[0]),this.Y(p[1])]);
    const tr=(ctx,dx,dy)=>{ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0]+dx,p[1]+dy):ctx.moveTo(p[0]+dx,p[1]+dy));if(closed)ctx.closePath();ctx.stroke()};

  else if(k==='blomst'){for(let i=0;i<5;i++){const a=-Math.PI/2+i/5*TAU,cx=x+Math.cos(a)*p*.8,cy=y+Math.sin(a)*p*.8;g.moveTo(cx+p*.56,cy);g.arc(cx,cy,p*.56,0,TAU)}g.moveTo(x+p*.5,y);g.arc(x,y,p*.5,0,TAU)}

  else if(k==='spiral'){g.lineWidth=r*.13;g.lineCap='round';for(let i=0;i<=60;i++){const a=i/60*TAU*2.4,q=r*.74*i/60;g[i?'lineTo':'moveTo'](x+Math.cos(a)*q,y+Math.sin(a)*q)}g.stroke();g.beginPath();g.arc(x,y,r*.12,0,TAU)}

    T.glow=(...a)=>{const q=Rm.glow(...a);GL[slot].push(q);return q};VAER[slot](G[slot],V[slot],C[slot],T)};
  const POS={vaeg:[0,40,-8],vindue:[-27,34,-6],seng:[-29,12,2],hylde:[13.5,30,-5],lampe:[11,39,-3],gulv:[0,2,6],ting:[21,10,8],dyreseng:[10,4,13]};

/* ============ spillet: fra kortet ind ad dørene og ud igen ============
   Kortet bliver liggende bagt, mens man er inde i et rum. Rummet bygges når man går ind, og ryddes helt væk når man går ud,
   så der kun er ét rum i hukommelsen ad gangen. Det tøj man vælger i Garderoben, har heksen på ude i byen. */
const RUM={vaerelse:{navn:'Værelset',html:'<div id="panel" hidden><div id="tabs" role="tablist" aria-label="Hvad vil du lave om?"></div><div id="opts"></div></div>'},garderobe:{navn:'Garderoben',html:'<div id="panel"><div id="tabs" role="tablist" aria-label="Hvad vil du skifte?"></div><div id="opts"></div></div>'},
  koncert:{navn:'Koncertsalen',html:'<div id="songs" role="group" aria-label="Ønsk en sang"><span>Ønsk en sang</span></div>'},
  gang:{navn:'Skolen'},eliksir:{navn:'Eliksirtimen'},bobler:{navn:'Boblebutikken'},arkade:{navn:'Arkaden'},gnom:{navn:'Bank en gnom'}};
const DOORS={kollegie:'vaerelse',koncert:'koncert',skole:'gang',bobler:'bobler',arkade:'arkade'};
const HUSNAVN={broend:'Øksebrønden',skole:'Magiskolen',bobler:'Boblebutikken',dyr:'Dyreparken',drage:'Dragehulen',arkade:'Arkaden',stoevle:'Den Flyvende Støvle',klokke:'Klokketårnet'};
const SLOTS=['hat','hår','pande','mærke','pupil','mund','tøj','kappe','støvler','tilbehør'];
const doorEl=document.getElementById('door'),doorT=document.getElementById('doorT'),rumEl=document.getElementById('rum'),hjemEl=document.getElementById('hjem'),hjemT=document.getElementById('hjemT'),toastEl=document.getElementById('toast'),stjN=document.getElementById('stjN'),stjEl=document.getElementById('stj');
let toastT=0;const toast=txt=>{toastEl.textContent=txt;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.hidden=true},2600)};
/* alt hvad rummet selv har malet og bygget, slippes igen; det fælles papir (som byen også bruger) bliver liggende */
function disposeRoom(room,matsBefore){const keep=new Set(MATS.values()),seen=new Set(),shared=new Set();for(const k in PAPER){shared.add(PAPER[k].tex);shared.add(PAPER[k].btex)}
  for(const sc of room.scenes){sc.traverse(o=>{if(o.geometry&&!o.isSprite)o.geometry.dispose();
      for(const m of(o.material?(Array.isArray(o.material)?o.material:[o.material]):[])){if(keep.has(m)||seen.has(m))continue;seen.add(m);
        for(const k of['map','bumpMap','normalMap','roughnessMap','emissiveMap','alphaMap'])if(m[k]&&m[k].dispose&&!shared.has(m[k]))m[k].dispose();m.dispose()}
      if(o.isLight&&o.shadow&&o.shadow.map){o.shadow.map.dispose();o.shadow.map=null}});
    sc.environment=null;sc.clear()}
  /* papirfarver som kun dette rum brugte, glemmes også, så listen ikke vokser for hvert besøg */
  for(const[k,m]of[...MATS])if(!matsBefore.has(k)){m.dispose();MATS.delete(k)}
  room.ST.dispose()}
/* stjernerne: tjenes i timerne og spillene, bruges i Boblebutikken */
const visStj=()=>{stjN.textContent=SPIL.stj};visStj();
SPIL.giv=n=>{if(n>0)LYD.ding();LOG.row('stjerner',{n,ialt:Math.max(0,SPIL.stj+n),ting:SPIL.har.length});SPIL.stj=Math.max(0,SPIL.stj+n);SPIL.save();visStj();stjEl.classList.remove('hop');void stjEl.offsetWidth;stjEl.classList.add('hop')};
/* rummene ligger i en stak: fra Værelset kan man gå videre ind i Garderoben, og tilbage-knappen fører ét trin ud ad gangen */
const stack=[],paaHeks=Object.assign({},SPIL.farver);let busy=false,dyrNyt=false;
function openRoom(id){const t0=performance.now(),ctx={alive:true,look:{},room:null,env:scene.environment,mats:new Set(MATS.keys())};
  for(const k of SLOTS)ctx.look[k]=HEKS.L[k];Object.assign(ctx.look,SPIL.lookFuld());
  ctx.onLook=(k,v)=>{SPIL.look[k]=v;SPIL.save()};ctx.onCol=(k,v)=>{SPIL.farver[k]=v;SPIL.save()};ctx.dyr=Object.assign({},SPIL.dyr);ctx.onDyr=(k,v)=>{SPIL.dyr[k]=v;SPIL.save();dyrNyt=true};ctx.go=enter;ctx.say=toast;ctx.back=back;ctx.owns=SPIL.ejer;
  ctx.ready=()=>{SPIL.roomMs=Math.round(performance.now()-t0);LOG.skaerm(id);LOG.row('rum',Object.assign({id,ms:SPIL.roomMs},window.__rumtid||{}),id);LOG.flush();busy=false;doorEl.classList.add('gone');hjemEl.hidden=false};
  ctx.fail=v=>{if(!v)return;LOG.row('fejl',{besked:String(v).slice(0,300),rum:id});LOG.flush();busy=false;doorT.textContent=v;hjemEl.hidden=false};
  ctx.msg={classList:{add(){ctx.ready()}}};ctx.msgN={set textContent(v){ctx.fail(v)}};
  SPIL.room={id,ctx};document.body.dataset.rum=id;rumEl.innerHTML=RUM[id].html||'';hjemT.textContent=stack.length>1?RUM[stack[stack.length-2]].navn:'Byen';
  setTimeout(()=>{try{ROOMS[id](ctx)}catch(e){console.error(e);ctx.fail('Fejl: '+e.message)}},40)}
function closeRoom(){const r=SPIL.room;if(!r)return;r.ctx.alive=false;try{if(r.ctx.cleanup)r.ctx.cleanup();if(r.ctx.room)disposeRoom(r.ctx.room,r.ctx.mats)}catch(e){console.error(e)}rumEl.innerHTML='';SPIL.room=null}
function cover(txt,then){doorT.textContent=txt;doorEl.classList.remove('gone');hjemEl.hidden=true;toastEl.hidden=true;setTimeout(then,300)}
function toMap(){LOG.skaerm('by');delete document.body.dataset.rum;renderer.setRenderTarget(null);renderer.setClearColor('#0d0a12');renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;
  for(const k of SLOTS)if(SPIL.look[k]!==undefined&&HEKS.L[k]!==SPIL.look[k])HEKS.set(k,SPIL.look[k]);
  for(const k in SPIL.farver)if(paaHeks[k]!==SPIL.farver[k]){paaHeks[k]=SPIL.farver[k];HEKS.setCol(k,SPIL.farver[k])}
  if(dyrNyt){dyrNyt=false;SPIL.nyKat()}
  SPIL.pause=false;if(SPIL.rebake){SPIL.rebake=false;bake()}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{busy=false;doorEl.classList.add('gone')}))}
function enter(id){if(busy||!ROOMS[id])return;LYD.doer();busy=true;SPIL.pause=true;stack.push(id);cover(`Går ind i ${RUM[id].navn} …`,()=>{closeRoom();openRoom(id)})}
function back(){if(busy||!SPIL.room)return;LYD.doer();busy=true;stack.pop();const to=stack[stack.length-1];cover(to?`Går ind i ${RUM[to].navn} …`:'Går ud i byen …',()=>{closeRoom();if(to)openRoom(to);else toMap()})}
const leave=back;hjemEl.addEventListener('click',back);
/* lyden kan slås fra og til */
/* notesknappen: til den der tester. Den tager et lille billede af skærmen, i det øjeblik man trykker, og gemmer det sammen med typen, teksten og hvor man står,
   samme sted som statistikken. Inde på Claude-siden kan der ikke gemmes, så dér er knappen væk. */
{const kn=document.getElementById('noteknap'),bx=document.getElementById('note'),fm=document.getElementById('noteF'),tx_=document.getElementById('noteTxt'),inf=document.getElementById('noteI'),tb=[...document.querySelectorAll('#noteT button')];let type='ser-forkert-ud',billede=null,sted=null;
  const kan=LOG.on||location.protocol==='file:';kn.hidden=!kan;
  const vis=()=>tb.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===type))),luk=()=>{bx.hidden=true;billede=null};
  const tag=()=>{try{const c=renderer.domElement,k=Math.min(1,560/c.width),o=document.createElement('canvas');o.width=Math.round(c.width*k);o.height=Math.round(c.height*k);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/jpeg',.6)}catch(e){return null}};
  SPIL.note=(t,tekst)=>{const d={type:t,tekst:String(tekst||'').slice(0,600),sted,rum:stack.slice(),skaerm:`${innerWidth}x${innerHeight}`,look:SPIL.look,farver:SPIL.farver,dyr:SPIL.dyr,indretning:SPIL.rum,indretningFarver:SPIL.rumc,stjerner:SPIL.stj,har:SPIL.har.length,billede};LOG.row('note',d,stack.length?stack[stack.length-1]:'by');LOG.flush();return d};
  kn.addEventListener('click',()=>{sted=stack.length?stack[stack.length-1]:'by';const pn=document.getElementById('panel'),menu=document.querySelector('#tabs [aria-selected=true]');if(pn&&!pn.hidden&&menu)sted+=' · '+menu.textContent;
    /* billedet tages lige efter spillets næste tegning, før menuen her lægger sig over */
    requestAnimationFrame(()=>{billede=tag();inf.textContent=`Gemmer også: hvor du står (${sted}), hvad heksen har på, og et lille billede af skærmen, som den så ud lige nu.`;tx_.value='';vis();bx.hidden=false})});
  tb.forEach(b=>b.addEventListener('click',()=>{type=b.dataset.t;vis()}));document.getElementById('noteNej').addEventListener('click',luk);bx.addEventListener('pointerdown',e=>{if(e.target===bx)luk()});
  fm.addEventListener('submit',e=>{e.preventDefault();SPIL.note(type,tx_.value);luk();toast(LOG.on?'Noten er gemt':'Noten kan ikke gemmes her')})}
{const lb=document.getElementById('lydknap'),vis=()=>{lb.setAttribute('aria-pressed',String(LYD.til));lb.setAttribute('aria-label',LYD.til?'Slå lyden fra':'Slå lyden til')};vis();lb.addEventListener('click',()=>{LYD.skift();vis()})}
SPIL.arrive=name=>{const id=DOORS[name];if(id&&ROOMS[id])enter(id);else if(HUSNAVN[name])toast(`${HUSNAVN[name]} åbner snart`)};
SPIL.enter=n=>enter(DOORS[n]||n);window.LOGTEST=()=>LOG.nu();SPIL.stack=stack;SPIL.leave=leave;SPIL.info=()=>Object.assign({programs:renderer.info.programs.length},renderer.info.memory);SPIL.heks=()=>Object.fromEntries(SLOTS.map(k=>[k,HEKS.L[k]]));window.__spil=SPIL;

const fsBtn=document.getElementById('fs'),fsNote=document.getElementById('fsnote');
fsBtn.addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();return}
  await document.documentElement.requestFullscreen({navigationUI:'hide'});try{await screen.orientation.lock('landscape')}catch(_){}}
  catch(_){fsNote.hidden=false;setTimeout(()=>{fsNote.hidden=true},7000)}});
