<style>
/* Layout: byen fylder hele skærmen; små papbrikker oven på til visning, måler og fuld skærm */
:root{
  --desk:#0d0a12;
  --kraft:#b88d5b;
  --kraft-dark:#76552f;
  --ink:#2a1d12;
  --paper:#efe3c8;
  --font:"Alegreya Sans","Gill Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--paper);font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:var(--desk)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 48%,rgba(0,0,0,0) 58%,rgba(6,3,12,.6) 100%)}
#now{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1f1838;z-index:2}
#now img{width:100%;height:100%;object-fit:contain;display:block}
body[data-view="nu"] #now{display:flex}
body[data-view="nu"] #hint,body[data-view="nu"] #meter{display:none}
.kraft{background:repeating-linear-gradient(0deg,rgba(60,40,20,.07) 0 2px,transparent 2px 9px),var(--kraft);color:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,235,200,.25),0 5px 0 var(--kraft-dark),0 9px 14px rgba(0,0,0,.55)}
#views{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;border-radius:14px;overflow:hidden}
#views button{font:inherit;font-weight:700;font-size:19px;border:0;padding:9px 16px;cursor:pointer;background:transparent;color:var(--ink)}
#views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#fs{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));width:46px;height:46px;border:0;border-radius:12px;display:grid;place-items:center;cursor:pointer}
#fs svg{width:24px;height:24px;fill:var(--ink)}
#fsnote{position:fixed;z-index:6;top:calc(66px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));max-width:min(340px,calc(100vw - 28px));padding:8px 12px;border-radius:12px;font-size:17px}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
#meter{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:5px 10px;border-radius:10px;font-size:15px;font-variant-numeric:tabular-nums;pointer-events:none;max-width:calc(100vw - 28px)}
#meter:empty{display:none}
#hint{position:fixed;z-index:3;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));text-align:center;font-size:19px;color:rgba(239,227,200,.88);text-shadow:0 1px 6px #000;pointer-events:none;transition:opacity .6s;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#hint.gone{opacity:0}
#msg{position:fixed;z-index:9;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:24px;background:var(--desk);transition:opacity .5s}
#msg small{font-size:17px;opacity:.7}
#msg.gone{opacity:0;pointer-events:none}
@media (max-height:520px){#views button{font-size:17px;padding:6px 12px}#meter{font-size:13px}#hint{font-size:16px;bottom:calc(40px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){#msg,#hint{transition:none}}
#panel{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(30vw,340px);display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:18px;background:repeating-linear-gradient(0deg,rgba(60,40,20,.07) 0 2px,transparent 2px 9px),#b88d5b;box-shadow:inset 0 0 0 2px rgba(255,235,200,.25),0 6px 0 #76552f,0 12px 22px rgba(0,0,0,.55);overflow:hidden}
#tabs{display:flex;flex-wrap:wrap;gap:6px}
#tabs button{flex:1 1 auto;font:700 17px var(--font);padding:9px 10px;border:0;border-radius:10px;background:rgba(42,29,18,.16);color:#2a1d12;cursor:pointer}
#tabs button[aria-selected=true]{background:#2a1d12;color:#efe3c8}
#opts{overflow:auto;display:flex;flex-direction:column;gap:8px}
#opts section{display:none}#opts section.on{display:block}
#opts h3{display:none;margin:2px 2px 6px;font:700 15px var(--font);letter-spacing:.08em;text-transform:uppercase;color:#4a3320}
#opts .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#opts button{font:700 17px var(--font);text-align:left;padding:11px 12px;min-height:44px;border:0;border-radius:12px;background:#efe3c8;color:#2a1d12;box-shadow:0 3px 0 #a8875a;cursor:pointer}
#opts button[aria-pressed=true]{background:#5a2f8a;color:#fff6dc;box-shadow:0 3px 0 #2e1650}
@media (min-height:740px) and (min-aspect-ratio:5/4){#tabs{display:none}#opts section{display:block}#opts h3{display:block}}
@media (max-aspect-ratio:5/4){#panel{top:auto;left:max(12px,env(safe-area-inset-left,0px));width:auto;max-height:38vh}}
@media (max-height:520px){#tabs button{font-size:14px;padding:6px 8px}#opts button{font-size:15px;padding:8px 10px;min-height:40px}#panel{gap:6px;padding:8px}}
#songs{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;max-width:calc(100vw - 24px);padding:6px 8px;border-radius:14px;background:rgba(30,14,20,.72);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#songs span{font:700 16px var(--font);color:#efe3c8;padding:0 6px}
#songs button{font:700 16px var(--font);padding:8px 12px;border:0;border-radius:10px;background:#b88d5b;color:#2a1d12;box-shadow:inset 0 0 0 2px rgba(255,235,200,.25),0 4px 0 #76552f;cursor:pointer}
#songs button[aria-pressed=true]{background:#2a1d12;color:#efe3c8;box-shadow:inset 0 0 0 2px #c9a04a}
@media (max-height:520px){#songs button{font-size:14px;padding:6px 9px}#songs span{display:none}}
/* spillet: knappen tilbage til byen, døren man går igennem, og en lille besked når et hus ikke er åbent endnu */
[hidden]{display:none!important}
body[data-rum] #hint,body[data-rum] #meter{display:none}
#hjem{position:fixed;z-index:9;top:calc(12px + env(safe-area-inset-top,0px));left:calc(max(14px,env(safe-area-inset-left,0px)) + 58px);height:46px;padding:0 16px 0 8px;border:0;border-radius:12px;display:flex;align-items:center;gap:4px;font:700 20px var(--font);cursor:pointer}
#hjem svg{width:26px;height:26px;fill:var(--ink)}
#door{position:fixed;inset:0;z-index:8;display:grid;place-items:center;text-align:center;padding:24px;background:repeating-linear-gradient(0deg,rgba(255,235,200,.025) 0 2px,transparent 2px 9px),var(--desk);font:700 30px "Alegreya SC",var(--font);letter-spacing:.03em;color:var(--paper);transition:opacity .28s}
#door.gone{opacity:0;pointer-events:none}
#toast{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:10px 18px;border-radius:14px;font:700 20px var(--font);max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
@media (max-height:520px){#hjem{font-size:17px}#door{font-size:24px}#toast{font-size:17px;bottom:calc(48px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){#door{transition:none}}
</style>

<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';
const msgN=document.getElementById('msgN');
/* ============ små hjælpere ============ */
const TAU=Math.PI*2, mix=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=rng(20261118);
const R=(a,b)=>b===undefined?rnd()*a:a+rnd()*(b-a);
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(2,Math.round(w));c.height=Math.max(2,Math.round(h));return c};
const grey=v=>{v=Math.round(v);return`rgb(${v},${v},${v})`};
function shade(h,d){const n=parseInt(h.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255,t=d>0?255:0,a=Math.abs(d);return`rgb(${Math.round(mix(r,t,a))},${Math.round(mix(g,t,a))},${Math.round(mix(b,t,a))})`}

const stage=document.getElementById('stage'), msg=document.getElementById('msg');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'})}
catch(e){msg.textContent='Din browser kan ikke vise 3D her (WebGL mangler).';throw e}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
stage.insertBefore(renderer.domElement,stage.firstChild);
const ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const FINE=matchMedia('(pointer:fine)').matches;
function tx(c,srgb){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=ANISO;return t}

/* ============ pap-teksturer (alt er tegnet med kode) ============ */
const KPX=512/12; // kraft-flisen er 12 cm bred
function makeKraft(){
  const S=512,c=cv(S,S),g=c.getContext('2d'),b=cv(S,S),h=b.getContext('2d');
  g.fillStyle='#b98e5c';g.fillRect(0,0,S,S);
  for(let y=0;y<S;y++){h.fillStyle=grey(128+16*Math.cos(y/32*TAU));h.fillRect(0,y,S,1)}
  for(let i=0;i<70;i++){const x=R(S),y=R(S),r=R(30,120),dark=rnd()<.5;
    for(const ox of[-S,0,S])for(const oy of[-S,0,S]){if(x+ox+r<0||x+ox-r>S||y+oy+r<0||y+oy-r>S)continue;
      const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);gr.addColorStop(0,dark?'rgba(118,82,44,.11)':'rgba(226,192,144,.11)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x+ox-r,y+oy-r,2*r,2*r)}}
  for(let k=0;k<16;k++){const y=k*32;const gr=g.createLinearGradient(0,y-9,0,y+9);gr.addColorStop(0,'rgba(70,45,20,0)');gr.addColorStop(.5,'rgba(70,45,20,.085)');gr.addColorStop(1,'rgba(70,45,20,0)');g.fillStyle=gr;g.fillRect(0,y-9,S,18);if(k===0)g.fillRect(0,S-9,S,9);
    const y2=y+16,g2=g.createLinearGradient(0,y2-9,0,y2+9);g2.addColorStop(0,'rgba(240,212,170,0)');g2.addColorStop(.5,'rgba(240,212,170,.07)');g2.addColorStop(1,'rgba(240,212,170,0)');g.fillStyle=g2;g.fillRect(0,y2-9,S,18)}
  g.lineCap='round';h.lineCap='round';
  for(let i=0;i<3200;i++){const x=R(S),y=R(S),a=R(TAU),l=R(4,15),dx=Math.cos(a)*l,dy=Math.sin(a)*l*.6,light=rnd()<.5;
    g.strokeStyle=light?'rgba(228,198,152,1)':'rgba(120,84,46,1)';g.globalAlpha=R(.07,.2);g.lineWidth=R(.5,1.3);
    for(const ox of[-S,0,S])for(const oy of[-S,0,S]){const X=x+ox,Y=y+oy;if(X<-20||X>S+20||Y<-20||Y>S+20)continue;g.beginPath();g.moveTo(X,Y);g.lineTo(X+dx,Y+dy);g.stroke();
      if(i%3===0){h.strokeStyle=light?'#a8a8a8':'#606060';h.globalAlpha=.3;h.lineWidth=1;h.beginPath();h.moveTo(X,Y);h.lineTo(X+dx,Y+dy);h.stroke()}}}
  g.globalAlpha=1;h.globalAlpha=1;
  const id=g.getImageData(0,0,S,S),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*15;d[i]+=n;d[i+1]+=n;d[i+2]+=n*.8}g.putImageData(id,0,0);
  return{c,b}}
function makeEdge(){
  const W=256,H=64,c=cv(W,H),g=c.getContext('2d');g.fillStyle='#7b5b38';g.fillRect(0,0,W,H);
  g.strokeStyle='#c4a06d';g.lineWidth=7;g.lineJoin='round';g.beginPath();for(let x=-8;x<=W+8;x+=2){const y=32+18*Math.sin(x/64*TAU);x===-8?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
  g.fillStyle='#cba873';g.fillRect(0,0,W,11);g.fillRect(0,H-11,W,11);g.fillStyle='rgba(50,32,14,.4)';g.fillRect(0,11,W,1.5);g.fillRect(0,H-12.5,W,1.5);
  const id=g.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*18;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);return c}
function makeMat(){
  const S=512,c=cv(S,S),g=c.getContext('2d');g.fillStyle='#285a4b';g.fillRect(0,0,S,S);
  const id=g.getImageData(0,0,S,S),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*10;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);
  const px=S/10;for(let i=0;i<=10;i++){const p=Math.round(i*px);g.fillStyle=i%10===0?'rgba(214,236,222,.5)':i%5===0?'rgba(214,236,222,.36)':'rgba(214,236,222,.17)';const w=i%10===0?2.4:i%5===0?1.6:1;g.fillRect(p-w/2,0,w,S);g.fillRect(0,p-w/2,S,w)}
  g.fillStyle='rgba(214,236,222,.17)';g.fillRect(S-1.2,0,1.2,S);g.fillRect(0,S-1.2,S,1.2);
  g.lineCap='round';for(let i=0;i<26;i++){const x=R(S),y=R(S),a=R(TAU),l=R(20,150);g.strokeStyle=rnd()<.6?'rgba(190,225,205,.16)':'rgba(10,30,24,.25)';g.lineWidth=R(.5,1.2);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  return c}
function makeTape(){
  const W=160,H=56,c=cv(W,H),g=c.getContext('2d');g.fillStyle='rgba(233,220,176,.93)';g.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){g.fillStyle=rnd()<.5?'rgba(255,248,220,.12)':'rgba(150,130,80,.1)';g.fillRect(0,R(H),W,R(.5,1.5))}
  g.globalCompositeOperation='destination-out';g.fillStyle='#000';
  for(const side of[0,1]){g.beginPath();const x0=side?W:0,s=side?-1:1;g.moveTo(x0,0);for(let y=0;y<=H;y+=4)g.lineTo(x0+s*R(1,7),y);g.lineTo(x0,H);g.closePath();g.fill()}
  return c}
function makeEnv(){
  const c=cv(256,128),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,128);gr.addColorStop(0,'#f3e6cf');gr.addColorStop(.35,'#8f7a62');gr.addColorStop(.6,'#3a3028');gr.addColorStop(1,'#141110');g.fillStyle=gr;g.fillRect(0,0,256,128);
  g.fillStyle='#fffaf0';g.fillRect(40,14,46,26);g.fillRect(170,8,30,20);g.fillStyle='#cfe0f2';g.fillRect(110,22,28,14);return c}

const KR=makeKraft();
const M={};
{const km=tx(KR.c,true),kb=tx(KR.b,false);km.wrapS=km.wrapT=kb.wrapS=kb.wrapT=THREE.RepeatWrapping;
 M.kraft=new THREE.MeshStandardMaterial({map:km,bumpMap:kb,bumpScale:1.4,roughness:.95});
 const em=tx(makeEdge(),true);em.wrapS=THREE.RepeatWrapping;M.edge=new THREE.MeshStandardMaterial({map:em,roughness:.95});
 M.edgeSoft=new THREE.MeshStandardMaterial({color:'#c8a574',roughness:.95});
 M.brass=new THREE.MeshStandardMaterial({color:'#c9a04a',metalness:1,roughness:.32});
 M.wood=new THREE.MeshStandardMaterial({color:'#d9bb8c',roughness:.75});
 M.thread=new THREE.MeshStandardMaterial({color:'#e9e4d8',roughness:.9});
 M.tape=new THREE.MeshStandardMaterial({map:tx(makeTape(),true),transparent:true,roughness:.62})}

/* ============ omrids: klippet i hånden ============ */
function catmull(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t,f=(a,b,c,d)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);return[f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]}
function wobble(pts,amp){if(!amp)return pts;const n=pts.length,f1=R(.9,1.6),f2=R(2.4,3.6),a1=R(TAU),a2=R(TAU),out=[];let s=0;
  for(let i=0;i<n;i++){const a=pts[(i-1+n)%n],b=pts[i],c=pts[(i+1)%n];let tx_=c[0]-a[0],ty=c[1]-a[1];const l=Math.hypot(tx_,ty)||1;tx_/=l;ty/=l;s+=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const d=amp*(Math.sin(s*f1+a1)*.6+Math.sin(s*f2+a2)*.4);out.push([b[0]+ty*d,b[1]-tx_*d])}return out}
function ccw(pts){let A=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];A+=a[0]*b[1]-b[0]*a[1]}return A<0?pts.slice().reverse():pts}
function dedupe(pts){return pts.filter((p,i)=>{const q=pts[(i+1)%pts.length];return Math.hypot(p[0]-q[0],p[1]-q[1])>1e-3})}
/* cp: [x,y] = blød kurve gennem punktet, [x,y,1] = skarpt hjørne */
function outline(cp,seg=7,amp=.035){const n=cp.length,out=[];
  for(let i=0;i<n;i++){const p1=cp[i],p2=cp[(i+1)%n];
    if(p1[2]&&p2[2]){const len=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]),k=Math.max(1,Math.round(len/1.2));for(let j=0;j<k;j++)out.push([mix(p1[0],p2[0],j/k),mix(p1[1],p2[1],j/k)]);continue}
    const p0=p1[2]?p1:cp[(i-1+n)%n],p3=p2[2]?p2:cp[(i+2)%n];for(let k=0;k<seg;k++)out.push(catmull(p0,p1,p2,p3,k/seg))}
  return ccw(dedupe(wobble(out,amp)))}
function curve(cp,seg=6){const o=[];for(let i=0;i<cp.length-1;i++){const p0=cp[Math.max(0,i-1)],p3=cp[Math.min(cp.length-1,i+2)];for(let k=0;k<seg;k++)o.push(catmull(p0,cp[i],cp[i+1],p3,k/seg))}o.push(cp[cp.length-1]);return o}
function ell(x,y,rx,ry,n=14,j=.08){const o=[];for(let i=0;i<n;i++){const a=i/n*TAU,k=1+R(-j,j);o.push([x+Math.cos(a)*rx*k,y+Math.sin(a)*ry*k])}return o}

class Painter{

    if(this.hc){const h=this.hc;h.save();h.globalAlpha=.7;h.fillStyle='#a6a6a6';this.path(h,region);h.fill();h.restore()}}

  dabs(color,n,o={}){const{x0=this.minx,x1=this.maxx,y0=this.miny,y1=this.maxy,len=.5,w=.12,dir=1.57,spread=.5,alpha=.8}=o,g=this.g;g.save();g.lineCap='round';g.strokeStyle=color;

}

function cardGeo(pts,t,P,both){
  const n=pts.length,pos=[],nor=[],uv=[],fi=[],bi=[],si=[];
  const tris=THREE.ShapeUtils.triangulateShape(pts.map(p=>new THREE.Vector2(p[0],p[1])),[]);
  for(const p of pts){pos.push(p[0],p[1],t/2);nor.push(0,0,1);uv.push((p[0]-P.minx)/P.W,(p[1]-P.miny)/P.H)}
  for(const p of pts){pos.push(p[0],p[1],-t/2);nor.push(0,0,-1);both?uv.push((p[0]-P.minx)/P.W,(p[1]-P.miny)/P.H):uv.push(p[0]/12,p[1]/12)}
  for(const[a,b,c]of tris){fi.push(a,b,c);bi.push(n+a,n+c,n+b)}
  let acc=0;for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1e-6,nx=dy/len,ny=-dx/len,u0=acc/2.8,u1=(acc+len)/2.8,v=2*n+i*4;acc+=len;
    pos.push(a[0],a[1],t/2,b[0],b[1],t/2,b[0],b[1],-t/2,a[0],a[1],-t/2);for(let k=0;k<4;k++)nor.push(nx,ny,0);uv.push(u0,1,u1,1,u1,0,u0,0);si.push(v,v+3,v+2,v,v+2,v+1)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex([...fi,...bi,...si]);g.addGroup(0,fi.length,0);g.addGroup(fi.length,bi.length,1);g.addGroup(fi.length+bi.length,si.length,2);return g}
function makeCard(pts,{t=.4,s=30,paint,both=false,bump=1.6,cap,noBump=false,edge=M.edge}={}){
  const P=new Painter(pts,s,{cap,noBump});if(paint)paint(P);
  const front=new THREE.MeshStandardMaterial({map:tx(P.c,true),roughness:.84});
  if(P.b){front.bumpMap=tx(P.b,false);front.bumpScale=bump}
  const m=new THREE.Mesh(cardGeo(pts,t,P,both),[front,both?front:M.kraft,edge]);m.castShadow=m.receiveShadow=true;return m}

function treeShapes(tree){const out=[];const walk=n=>{for(const ch of n.Childs()){if(ch.IsHole())continue;out.push({outer:fromC(ch.Contour()),holes:ch.Childs().map(h=>fromC(h.Contour()))});for(const h of ch.Childs())walk(h)}};walk(tree);return out}
function clip(subj,clp,type){const c=new CL.Clipper();c.AddPaths(subj.map(toC),CL.PolyType.ptSubject,true);if(clp&&clp.length)c.AddPaths(clp.map(toC),CL.PolyType.ptClip,true);
  const tree=new CL.PolyTree();c.Execute({union:CL.ClipType.ctUnion,inter:CL.ClipType.ctIntersection,diff:CL.ClipType.ctDifference}[type],tree,CL.PolyFillType.pftNonZero,CL.PolyFillType.pftNonZero);return treeShapes(tree)}
/* tykke linjer med runde led og ender (stier), og en form gjort større/mindre */
function thick(lines,w){const co=new CL.ClipperOffset(2,CS*.02);for(const l of lines)co.AddPath(toC(l),CL.JoinType.jtRound,CL.EndType.etOpenRound);const tree=new CL.PolyTree();co.Execute(tree,w*CS);return treeShapes(tree)}
function grow(pts,d,round=true){const co=new CL.ClipperOffset(2,CS*.02);co.AddPath(toC(pts),round?CL.JoinType.jtRound:CL.JoinType.jtMiter,CL.EndType.etClosedPolygon);const tree=new CL.PolyTree();co.Execute(tree,d*CS);return treeShapes(tree)}
const ring=(pts,d,round)=>clip(grow(pts,d,round).map(s=>s.outer),[pts],'diff');

/* præcise former */
const box=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
function arch(cx,y0,w,h,n=18){const r=w/2,yc=y0+h-r,o=[[cx-r,y0],[cx+r,y0],[cx+r,yc]];for(let i=1;i<n;i++){const a=i/n*Math.PI;o.push([cx+Math.cos(a)*r,yc+Math.sin(a)*r])}o.push([cx-r,yc]);return o}
function circ(cx,cy,rx,ry=rx,n=40){const o=[];for(let i=0;i<n;i++){const a=i/n*TAU;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return o}
function wedge(cx,cy,r0,r1,a0,a1,n=6){const o=[];for(let i=0;i<=n;i++){const a=mix(a0,a1,i/n);o.push([cx+Math.cos(a)*r1,cy+Math.sin(a)*r1])}for(let i=n;i>=0;i--){const a=mix(a0,a1,i/n);o.push([cx+Math.cos(a)*r0,cy+Math.sin(a)*r0])}return o}
const area=p=>{let A=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];A+=a[0]*b[1]-b[0]*a[1]}return A/2};
const toCCW=p=>area(p)<0?p.slice().reverse():p,toCW=p=>area(p)>0?p.slice().reverse():p;

/* farver */
function rgbOf(c){if(c[0]==='#'){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}const m=c.match(/[\d.]+/g).map(Number);return m.slice(0,3)}
const rgba=(c,a)=>{const[r,g,b]=rgbOf(c);return`rgba(${r},${g},${b},${a})`};
const hexOf=c=>{const[r,g,b]=rgbOf(c);return'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')};

/* ---- papirtyperne: sømløse fliser, tegnet én gang ---- */
function paperTile({tone=[244,240,232],mottle=7,fibers=1600,flen=[4,14],falpha=[.04,.1],noise=7,dots=0,dotR=[2,5],bumpFib=.25,gravel=0,S=512}){
  const c=cv(S,S),g=c.getContext('2d'),b=cv(S,S),h=b.getContext('2d');
  g.fillStyle=`rgb(${tone})`;g.fillRect(0,0,S,S);h.fillStyle='#808080';h.fillRect(0,0,S,S);
  const wrap=(x,y,r,f)=>{for(const ox of[-S,0,S])for(const oy of[-S,0,S]){if(x+ox+r<0||x+ox-r>S||y+oy+r<0||y+oy-r>S)continue;f(x+ox,y+oy)}};
  for(let i=0;i<60;i++){const x=R(S),y=R(S),r=R(40,140),d=rnd()<.5;wrap(x,y,r,(X,Y)=>{const gr=g.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,d?`rgba(90,70,50,${mottle/255})`:`rgba(255,255,255,${mottle/255})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(X-r,Y-r,2*r,2*r)})}
  for(let i=0;i<dots;i++){const x=R(S),y=R(S),r=R(...dotR),up=rnd()<.55;wrap(x,y,r,(X,Y)=>{const gr=h.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,up?'rgba(255,255,255,.45)':'rgba(0,0,0,.4)');gr.addColorStop(1,'rgba(128,128,128,0)');h.fillStyle=gr;h.fillRect(X-r,Y-r,2*r,2*r)})}
  for(let i=0;i<gravel;i++){const x=R(S),y=R(S),r=R(1,3.2),v=R(-50,40);wrap(x,y,r+2,(X,Y)=>{g.fillStyle=`rgba(${v<0?'70,55,40':'255,250,235'},${Math.abs(v)/160})`;g.beginPath();g.ellipse(X,Y,r,r*R(.6,1),R(3),0,TAU);g.fill();h.fillStyle='rgba(255,255,255,.5)';h.beginPath();h.ellipse(X,Y,r,r*.8,0,0,TAU);h.fill();h.fillStyle='rgba(0,0,0,.35)';h.beginPath();h.ellipse(X+r*.5,Y+r*.6,r*.8,r*.5,0,0,TAU);h.fill()})}
  g.lineCap=h.lineCap='round';
  for(let i=0;i<fibers;i++){const x=R(S),y=R(S),a=R(TAU),l=R(...flen),dx=Math.cos(a)*l,dy=Math.sin(a)*l,light=rnd()<.5;
    wrap(x,y,l,(X,Y)=>{g.strokeStyle=light?'rgba(255,255,255,1)':'rgba(110,90,70,1)';g.globalAlpha=R(...falpha);g.lineWidth=R(.5,1.2);g.beginPath();g.moveTo(X,Y);g.quadraticCurveTo(X+dx*.5+R(-2,2),Y+dy*.5+R(-2,2),X+dx,Y+dy);g.stroke();
      h.strokeStyle=light?'#fff':'#000';h.globalAlpha=bumpFib*R(.3,1);h.lineWidth=1;h.beginPath();h.moveTo(X,Y);h.lineTo(X+dx,Y+dy);h.stroke()})}
  g.globalAlpha=h.globalAlpha=1;
  const id=g.getImageData(0,0,S,S),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*noise;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);
  return{c,b}}
const PAPER={};
function makePapers(){if(PAPER.card)return;
  PAPER.card={...paperTile({tone:[246,243,236],mottle:5,fibers:1400,falpha:[.03,.08],noise:6,bumpFib:.2}),k:1/14,bs:.5};
  PAPER.water={...paperTile({tone:[248,245,238],mottle:8,fibers:900,falpha:[.03,.07],noise:6,dots:1700,dotR:[2,6],bumpFib:.15}),k:1/12,bs:1.1};
  PAPER.tissue={...paperTile({tone:[252,248,238],mottle:26,fibers:700,flen:[18,60],falpha:[.08,.2],noise:10,bumpFib:.1}),k:1/9,bs:.2};
  PAPER.sand={...paperTile({tone:[238,226,200],mottle:10,fibers:600,falpha:[.03,.07],noise:8,gravel:900,bumpFib:.15}),k:1/10,bs:.9};
  PAPER.kraft={c:KR.c,b:KR.b,k:1/12,bs:1.2};
  /* balsatræ med årer */
  {const S=256,c=cv(S,S),g=c.getContext('2d');g.fillStyle='#e8d2a6';g.fillRect(0,0,S,S);for(let i=0;i<90;i++){const y=R(S),a=R(.04,.16);g.strokeStyle=rnd()<.6?`rgba(150,105,60,${a})`:`rgba(255,240,210,${a})`;g.lineWidth=R(.6,2.4);g.beginPath();g.moveTo(0,y);for(let x=0;x<=S;x+=16)g.lineTo(x,y+Math.sin(x/S*TAU*2+i)*2);g.stroke()}
   PAPER.balsa={c,b:c,k:1/6,bs:.3}}
  /* pigmentkorn til akvarellen: hvidt med små mørke prikker */
  {const S=256,c=cv(S,S),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S,S);for(let i=0;i<2600;i++){g.fillStyle=`rgba(60,40,70,${R(.05,.22)})`;g.beginPath();g.arc(R(S),R(S),R(.4,1.4),0,TAU);g.fill()}PAPER.gran={c}}
  for(const k in PAPER){if(k==='gran')continue;const p=PAPER[k];p.tex=tx(p.c,true);p.tex.wrapS=p.tex.wrapT=THREE.RepeatWrapping;p.btex=tx(p.b,false);p.btex.wrapS=p.btex.wrapT=THREE.RepeatWrapping}}
const MATS=new Map();
function paperMat(color,kind='card',o={}){const key=color+kind+JSON.stringify(o);if(MATS.has(key))return MATS.get(key);makePapers();const p=PAPER[kind];
  const m=new THREE.MeshStandardMaterial({color:new THREE.Color(hexOf(color)),map:p.tex,bumpMap:p.btex,bumpScale:p.bs,roughness:o.rough??.9,metalness:o.metal??0});
  if(o.glow){m.emissive=new THREE.Color(o.glow);m.emissiveMap=p.tex;m.emissiveIntensity=o.gi??1.6}
  if(o.env)m.envMapIntensity=o.env;MATS.set(key,m);return m}
/* guldfolie og den farvede kerne i kanten af et snit */
const gold=()=>paperMat('#e0b964','card',{metal:.85,rough:.33,env:3.2});
const coreOf=(c,kind)=>kind==='water'||kind==='tissue'?'#efe7d8':kind==='kraft'?'#b08a5a':hexOf(shade(hexOf(c),.1));

/* ---- geometri: en plade med tykkelse og huller; papiret ligger i verdens-målestok ---- */
function slabGeo(outer,holes,t,uv){
  outer=toCCW(outer);holes=(holes||[]).map(toCW);const loops=[outer,...holes];
  const tris=THREE.ShapeUtils.triangulateShape(outer.map(p=>new THREE.Vector2(p[0],p[1])),holes.map(h=>h.map(p=>new THREE.Vector2(p[0],p[1]))));
  const flat=[].concat(...loops),n=flat.length,pos=[],nor=[],uvs=[],fi=[],bi=[],si=[];
  for(const p of flat){pos.push(p[0],p[1],t/2);nor.push(0,0,1);uvs.push(...uv(p[0],p[1]))}
  for(const p of flat){pos.push(p[0],p[1],-t/2);nor.push(0,0,-1);uvs.push(...uv(p[0],p[1]))}
  for(let[a,b,c]of tris){const A=flat[a],B=flat[b],C=flat[c];if((B[0]-A[0])*(C[1]-A[1])-(B[1]-A[1])*(C[0]-A[0])<0)[b,c]=[c,b];fi.push(a,b,c);bi.push(n+a,n+c,n+b)}
  let v=2*n;for(const L of loops){let acc=0;for(let i=0;i<L.length;i++){const a=L[i],b=L[(i+1)%L.length],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1e-6,nx=dy/len,ny=-dx/len;
    pos.push(a[0],a[1],t/2,b[0],b[1],t/2,b[0],b[1],-t/2,a[0],a[1],-t/2);for(let k=0;k<4;k++)nor.push(nx,ny,0);uvs.push(acc/3,1,(acc+len)/3,1,(acc+len)/3,0,acc/3,0);acc+=len;si.push(v,v+3,v+2,v,v+2,v+1);v+=4}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex([...fi,...bi,...si]);g.addGroup(0,fi.length,0);g.addGroup(fi.length,bi.length,1);g.addGroup(fi.length+bi.length,si.length,2);return g}

/* maleren på rigtigt papir: akvarel-lag, ridsede fuger og en fin pen */
class Painter2 extends Painter{
  constructor(pts,s,opt={}){super(pts,s,Object.assign({},opt,{noBump:false}));makePapers();const B=PAPER[opt.base||'water'];
    const k=this.s/(B.k*B.c.width),fill=(ctx,img)=>{ctx.save();ctx.globalAlpha=1;ctx.scale(k,k);ctx.fillStyle=ctx.createPattern(img,'repeat');ctx.fillRect(0,0,this.w/k+2,this.h/k+2);ctx.restore()};
    fill(this.g,B.c);fill(this.hc,B.b)}
  clipTo(ctx,region){if(region){this.path(ctx,region);ctx.clip()}}
  /* et lag akvarel: gennemsigtig farve, mørkere kant hvor pigmentet samler sig, korn og skyer */
  wash(color,region,{alpha=.92,edge=.55,grain=.3,top=null,clouds=6,blur=.35,mode='multiply'}={}){const{w,h,s,g}=this,L=scratch(0,w,h),l=L.getContext('2d');
    l.clearRect(0,0,w,h);l.save();this.clipTo(l,region);
    if(top){const gr=l.createLinearGradient(0,this.Y(this.maxy),0,this.Y(this.miny));gr.addColorStop(0,top);gr.addColorStop(1,color);l.fillStyle=gr}else l.fillStyle=color;l.fillRect(0,0,w,h);
    for(let i=0;i<clouds;i++){const x=R(w),y=R(h),r=R(.15,.45)*Math.max(w,h),c2=shade(hexOf(color),R(-.14,.1)),gr=l.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(c2,.5));gr.addColorStop(1,rgba(c2,0));l.fillStyle=gr;l.fillRect(x-r,y-r,2*r,2*r)}
    if(grain){l.globalAlpha=grain;l.globalCompositeOperation='multiply';const p=l.createPattern(PAPER.gran.c,'repeat');l.fillStyle=p;l.fillRect(0,0,w,h);l.globalCompositeOperation='source-over';l.globalAlpha=1}
    if(region&&edge){l.globalCompositeOperation='source-atop';l.filter=`blur(${Math.max(1,blur*s*.5)}px)`;l.strokeStyle=shade(hexOf(color),-.3);l.globalAlpha=edge;l.lineWidth=blur*s;this.path(l,region);l.stroke();l.filter='none';l.globalAlpha=1;l.globalCompositeOperation='source-over'}
    l.restore();g.save();g.globalCompositeOperation=mode;g.globalAlpha=alpha;g.drawImage(L,0,0);g.restore()}
  /* en jævn, dækkende farve (farvet karton eller tryk) */
  flat(color,region,alpha=1){const g=this.g;g.save();g.globalAlpha=alpha;g.globalCompositeOperation='multiply';g.fillStyle=color;if(region){this.path(g,region);g.fill()}else g.fillRect(0,0,this.w,this.h);g.restore()}
  /* en ridset fuge: rille i relieffet og en svag mørk streg */
  score(pts,{w=.07,ink=.22,closed=false,dark='#3a2a40'}={}){const{g,hc}=this,lw=Math.max(1,w*this.s),P=pts.map(p=>[this.X(p[0]),this.Y(p[1])]);
    const tr=(ctx,dx,dy)=>{ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0]+dx,p[1]+dy):ctx.moveTo(p[0]+dx,p[1]+dy));if(closed)ctx.closePath();ctx.stroke()};
    hc.save();hc.lineCap=hc.lineJoin='round';hc.strokeStyle='#000';hc.globalAlpha=.55;hc.lineWidth=lw;tr(hc,0,0);hc.strokeStyle='#fff';hc.globalAlpha=.35;hc.lineWidth=lw*.6;tr(hc,lw*.6,lw*.6);hc.restore();
    g.save();g.lineCap=g.lineJoin='round';g.strokeStyle=dark;g.globalAlpha=ink;g.lineWidth=lw*.8;tr(g,0,0);g.strokeStyle='#fff';g.globalAlpha=ink*.5;g.lineWidth=lw*.5;tr(g,lw*.6,lw*.6);g.restore()}
  pen(pts,color,w=.06,alpha=.9,closed=false){const g=this.g;g.save();g.lineCap=g.lineJoin='round';g.strokeStyle=color;g.globalAlpha=alpha;g.lineWidth=Math.max(.8,w*this.s);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(this.X(p[0]),this.Y(p[1])):g.moveTo(this.X(p[0]),this.Y(p[1])));if(closed)g.closePath();g.stroke();g.restore()}
  /* kvadersten: rækker af forskellig højde, sten af forskellig bredde, hver med sin egen tone */
  ashlar(region,color,{rowH=[1.1,1.5],bw=[1.8,3.4],tint=.09,ink=.2}={}){const g=this.g;g.save();this.clipTo(g,region);this.hc.save();this.clipTo(this.hc,region);
    for(let y=this.miny,r=0;y<this.maxy;r++){const rh=R(...rowH);let x=this.minx-R(0,bw[0]);
      while(x<this.maxx){const sw=R(...bw),st=box(x+.04,y+.04,x+sw-.04,y+rh-.04);this.flat(shade(hexOf(color),R(-tint,tint*.6)),st,.35);this.score([...st,st[0]],{w:.08,ink});x+=sw}y+=rh}
    g.restore();this.hc.restore()}}

/* ---- et stykke: præcist udskåret, evt. med huller, af en bestemt papirtype ----
   shape: punkter eller {outer,holes}. paint: maler forsiden på akvarelpapir (ellers bruges det fælles papir). */
function piece(shape,{color='#ffffff',kind='card',t=.2,edge,paint,s=24,cap=1024,base,front,both=false,mat}={}){
  const outer=shape.outer||shape,holes=shape.holes||[];let fm,uv;
  if(paint){const P=new Painter2(outer,s,{cap,base:base||kind});paint(P);fm=new THREE.MeshStandardMaterial({map:tx(P.c,true),bumpMap:tx(P.b,false),bumpScale:PAPER[base||kind].bs,roughness:.9});fm.userData.own=true;uv=(x,y)=>[(x-P.minx)/P.W,(y-P.miny)/P.H]}
  else{makePapers();fm=mat||paperMat(color,kind);const k=PAPER[kind].k;uv=(x,y)=>[x*k,y*k]}
  const bm=both?fm:paperMat(paint?'#f2ece0':color,paint?'water':kind),em=paperMat(edge||coreOf(paint?'#f2ece0':color,paint?'water':kind),'card');
  const m=new THREE.Mesh(slabGeo(outer,holes,t,uv),[fm,bm,em]);m.castShadow=m.receiveShadow=true;return m}
/* lægger flere stykker fra en clip-operation */
function pieces(shapes,o,parent,x=0,y=0,z=0){return shapes.map(s=>put(parent,piece(s,o),x,y,z))}
/* en firkantet balsapind */
function stick(parent,x,y0,y1,z,w=.5,color='#c9a575'){const m=new THREE.Mesh(new THREE.BoxGeometry(w,y1-y0,w),paperMat(color,'balsa'));m.castShadow=m.receiveShadow=true;return put(parent,m,x,(y0+y1)/2,z)}

/* ---- tag af tagsten: rækker af bølgekantede strimler, hver række lidt foran den over ---- */
function shingleRoof(parent,shape,{color,rowH=1.05,tile=1.3,z=0,dz=.1,t=.14,kind='card',vary=.05,backing=true}){
  let miny=1e9,maxy=-1e9,minx=1e9,maxx=-1e9;for(const[x,y]of shape){miny=Math.min(miny,y);maxy=Math.max(maxy,y);minx=Math.min(minx,x);maxx=Math.max(maxx,x)}
  if(backing)put(parent,piece(shape,{color:shade(hexOf(color),-.45),kind,t}),0,0,z-dz);
  let row=0;for(let y=maxy;y>miny-rowH;y-=rowH,row++){const top=y+rowH*.5,bot=y-rowH,ph=row%2?tile/2:0,band=[[maxx+1,top],[minx-1,top]];
    for(let x=minx-1-ph;x<maxx+1+tile;x+=tile){for(let k=0;k<=6;k++){const a=Math.PI+k/6*Math.PI;band.push([x+tile/2+Math.cos(a)*tile/2,bot+rowH*.45+Math.sin(a)*rowH*.45])}}
    const col=shade(hexOf(color),R(-vary,vary));pieces(clip([toCCW(band)],[shape],'inter'),{color:col,kind,t},parent,0,0,z+row*dz)}
  return z+row*dz}

/* ---- et vindue: hul i muren, silkepapir bag hullet der lyser, sprosser, karm og sålbænk ---- */
function windowParts(parent,shape,z,{t=.3,glow='#ffcf7a',lit=true,frame='#3a2c38',fw=.32,mull='#3a2c38',cross=true,sill='#b9b0c9',curtain=null}={}){
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;for(const[x,y]of shape){minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}
  const cx=(minx+maxx)/2,back=z-t/2;
  put(parent,piece(grow(shape,.35)[0].outer,{t:.03,mat:lit?paperMat('#fff0c8','tissue',{glow,gi:1.7}):paperMat('#3a3350','tissue')}),0,0,back-.08);
  if(curtain)for(const s of[-1,1]){const x0=s<0?minx:maxx,cw=(maxx-minx)*.3,cp=[[x0,maxy+.2],[x0+(s<0?cw:-cw),maxy+.2],[x0+(s<0?cw*.35:-cw*.35),mix(miny,maxy,.45)],[x0+(s<0?cw*.8:-cw*.8),miny-.2],[x0,miny-.2]];
    pieces(clip([toCCW(cp)],[shape],'inter'),{color:curtain,kind:'tissue',t:.03,mat:paperMat(curtain,'tissue',lit?{glow:shade(hexOf(curtain),.2),gi:.5}:{})},parent,0,0,back-.04)}
  const mw=.14,strips=[box(cx-mw/2,miny-1,cx+mw/2,maxy+1)];if(cross)strips.push(box(minx-1,mix(miny,maxy,.52)-mw/2,maxx+1,mix(miny,maxy,.52)+mw/2));
  pieces(clip(strips,[shape],'inter'),{color:mull,t:.08},parent,0,0,back+.06);
  pieces(ring(shape,fw,false),{color:frame,t:.14},parent,0,0,z+t/2+.07);
  if(sill)put(parent,piece(box(minx-fw-.25,miny-fw-.32,maxx+fw+.25,miny-fw+.02),{color:sill,kind:'water',t:.34}),0,0,z+t/2+.17)}

/* ---- flere værktøjer: huse med dør og sted, skilte, malede mønstre, tråde og kroner ---- */
const HOUSE={},HOUSEG=[];
/* et hus er en gruppe; door = midt for døren (x,z), spot = hvor heksen stiller sig */

/* et skilt: plade, kant og bygningens egen skrift — mærket, så kvalitetstjekket kan finde det */

  {const pts=[];for(let i=0;i<=24;i++){const t=i/24;pts.push([mix(OPEN.x0+3,OPEN.x1-3,t),OPEN.y1-5-2.6*Math.sin(t*Math.PI),-8])}cord(live,pts,.05,'#3a2a20');for(let i=1;i<24;i+=2){const[x,y,z]=pts[i];const s=glowSprite(['rgba(255,120,160,.95)','rgba(120,220,255,.95)','rgba(255,220,120,.95)','rgba(160,255,140,.95)'][(i>>1)%4],2.2);s.position.set(x,y-.6,z+.2);live.add(s);GL.push({spr:s,blink:R(TAU)})}}
  curtain=makeCurtain();
  for(const gl of GL){if(gl.spr)continue;const s=glowSprite(gl.c,gl.s);s.position.copy(gl.p);live.add(s);gl.spr=s;gl.base=gl.s;gl.ph=R(TAU)}
  setStyle('hygge',true);
  ST.bake();msg.classList.add('gone');
  let t=0,last=performance.now();
  const loop=now=>{if((typeof ctx!=='undefined')&&!ctx.alive)return;requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;const beat=t*1.7*TAU/2;
    for(const o of BAND){const walking=o.q.length>0;
      if(walking){const[tx_,tz_]=o.q[0],dx=tx_-o.x,dz=tz_-o.z,d=Math.hypot(dx,dz),st=Math.min(d,13*dt);if(d<.05)o.q.shift();else{o.x+=dx/d*st;o.z+=dz/d*st;if(Math.abs(dx)>.2)o.dir=dx>0?1:-1;o.wp=(o.wp||0)+st}}
      else o.dir+=(1-o.dir)*Math.min(1,dt*8);
      const hop=walking?Math.abs(Math.sin((o.wp||0)*.55))*1.1:Math.abs(Math.sin(beat+o.i*.4))*.35;o.fy=(o.fy===undefined?floorY(o.x,o.z):o.fy+(floorY(o.x,o.z)-o.fy)*Math.min(1,dt*10));
      o.G.position.set(o.x,OPEN.y0+.15+o.fy+hop,o.z);o.G.scale.set(o.sc*(o.dir<0?-1:1),o.sc,o.sc);o.G.rotation.z=walking?.06*Math.sin((o.wp||0)*.55)*o.dir:0;
      o.sh.position.set(o.x,OPEN.y0+.22+o.fy,o.z+.3);o.sh.material.opacity=1-hop*.25;
      o.head.rotation.z=.08*Math.sin(beat*.5+o.i);o.hatG.rotation.z=.06*Math.sin(beat*.5+o.i+1);
      if(!walking){if(o.inst==='guitar')o.armR.rotation.z=.9+.35*Math.sin(beat*2);if(o.inst==='mic')o.armL.rotation.z=-2.6+.25*Math.sin(beat*.5);if(o.inst==='trommer'){o.armL.rotation.z=-.7+.5*Math.max(0,Math.sin(beat*2));o.armR.rotation.z=.7-.5*Math.max(0,Math.sin(beat*2+Math.PI))}if(o.inst==='bas')o.armR.rotation.z=.4+.3*Math.sin(beat)}
      const m=MARK[o.i],on=Math.hypot(o.x-m.x,o.z-m.z)<1.5?1:0,sp=SPOT[o.i];sp.userData.a=(sp.userData.a??1)+(on-(sp.userData.a??1))*Math.min(1,dt*4);sp.material.opacity=.35*sp.userData.a}
    for(const gl of GL){if(gl.blink!==undefined){const k=.6+.4*Math.sin(t*2+gl.blink);gl.spr.scale.set(2.2*k,2.2*k,1)}else{const k=gl.f?(.92+.08*Math.sin(t*9+gl.ph)*Math.sin(t*5.3)):(.95+.05*Math.sin(t*3+gl.ph));gl.spr.scale.set(gl.base*k,gl.base*k,1)}}
    SPOT.forEach((sp,i)=>{sp.rotation.z=.08*Math.sin(t*.7+i*1.3)});
    if(BD.disko&&BD.disko.visible)BD.disko.userData.ball.rotation.y+=dt*.8;
    /* tæppet */
    const c=curtain;c.t+=(c.target-c.t)*Math.min(1,dt*2.6);for(const h of c.halves){h.g.position.x=h.s*(mix(28,0,c.t))-h.s*0+h.s*0;h.g.scale.x=mix(.18,1,c.t)}
    ST.draw()};requestAnimationFrame(loop);
  window.__koncert={ready:true,setStyle,bakeMs:ST.bakeMs}}catch(e){msgN.textContent='Fejl: '+e.message;console.error(e)}})();

/* ---- ønsk en sang: tæppet går for, bandet skifter tøj, og tæppet går fra igen ---- */
let busy=false;
function setStyle(k,now){const S=STY[k];cur=k;for(const n in BD)BD[n].visible=n===S.bd;for(const o of BAND)dress(o,k);SPOT.forEach(sp=>sp.material.color.set(S.light));liveHemi.color.set(S.light);
  if(curtain&&now){curtain.t=0;curtain.target=0}}
/* tøjet skiftes først, når tæppet er helt for, så ingen ser det ske */
const until=f=>new Promise(r=>{const c=()=>(f()||((typeof ctx!=='undefined')&&!ctx.alive))?r():setTimeout(c,50);c()});
/* bandet går ud i kulissen, tæppet går for, og de kommer gående ind igen i det nye tøj */
const OFF=42;
function walkOut(){for(const o of BAND){const m=MARK[o.i],r=RIS.find(r=>m.x>r.x0&&m.x<r.x1&&m.z>r.z0&&m.z<r.z1+.4);o.q=[];if(r)o.q.push([m.ex<0?r.x0-1.6:r.x1+1.6,m.z]);o.q.push([m.ex*OFF,m.z])}}
function walkIn(){for(const o of BAND){const m=MARK[o.i],r=RIS.find(r=>m.x>r.x0&&m.x<r.x1&&m.z>r.z0&&m.z<r.z1+.4);o.q=[];if(r)o.q.push([m.ex<0?r.x0-1.6:r.x1+1.6,m.z]);o.q.push([m.x,m.z])}}
const idle=()=>BAND.every(o=>!o.q.length);
async function wish(k){if(busy||k===cur)return;busy=true;walkOut();await until(idle);curtain.target=1;await until(()=>curtain.t>.97);setStyle(k);await new Promise(r=>setTimeout(r,450));curtain.target=0;await until(()=>curtain.t<.12);walkIn();await until(idle);busy=false}
{const box_=document.getElementById('songs');for(const k in STY){const b=document.createElement('button');b.type='button';b.textContent=STY[k].n;b.addEventListener('click',()=>{wish(k);box_.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});if(k==='hygge')b.setAttribute('aria-pressed','true');box_.appendChild(b)}}

ctx.room={scenes:[scene,live],ST}};
/* ============ spillet: fra kortet ind ad dørene og ud igen ============
   Kortet bliver liggende bagt, mens man er inde i et rum. Rummet bygges når man går ind, og ryddes helt væk når man går ud,
   så der kun er ét rum i hukommelsen ad gangen. Det tøj man vælger i Garderoben, har heksen på ude i byen. */
const DOORS={kollegie:{rum:'garderobe',navn:'Garderoben'},koncert:{rum:'koncert',navn:'Koncertsalen'}};
const HUSNAVN={broend:'Øksebrønden',skole:'Magiskolen',bobler:'Boblebutikken',dyr:'Dyreparken',drage:'Dragehulen',arkade:'Arkaden',stoevle:'Den Flyvende Støvle'};
const RUMHTML={garderobe:'<div id="panel"><div id="tabs" role="tablist" aria-label="Hvad vil du skifte?"></div><div id="opts"></div></div>',
  koncert:'<div id="songs" role="group" aria-label="Ønsk en sang"><span>Ønsk en sang</span></div>'};
const SLOTS=['hat','hår','tøj','kappe','tilbehør'];
const doorEl=document.getElementById('door'),doorT=document.getElementById('doorT'),rumEl=document.getElementById('rum'),hjemEl=document.getElementById('hjem'),toastEl=document.getElementById('toast');
let toastT=0;const toast=txt=>{toastEl.textContent=txt;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.hidden=true},2600)};
/* alt hvad rummet selv har malet og bygget, slippes igen; det fælles papir (som byen også bruger) bliver liggende */
function disposeRoom(room,matsBefore){const keep=new Set(MATS.values()),seen=new Set(),shared=new Set();for(const k in PAPER){shared.add(PAPER[k].tex);shared.add(PAPER[k].btex)}
  for(const sc of room.scenes){sc.traverse(o=>{if(o.geometry&&!o.isSprite)o.geometry.dispose();
      for(const m of(o.material?(Array.isArray(o.material)?o.material:[o.material]):[])){if(keep.has(m)||seen.has(m))continue;seen.add(m);
        for(const k of['map','bumpMap','normalMap','roughnessMap','emissiveMap','alphaMap'])if(m[k]&&m[k].dispose&&!shared.has(m[k]))m[k].dispose();m.dispose()}
      if(o.isLight&&o.shadow&&o.shadow.map){o.shadow.map.dispose();o.shadow.map=null}});
    sc.environment=null;sc.clear()}
  /* papirfarver som kun dette rum brugte, glemmes også, så listen ikke vokser for hvert besøg */
  for(const[k,m]of[...MATS])if(!matsBefore.has(k)){m.dispose();MATS.delete(k)}
  room.ST.dispose()}
function enter(d){if(SPIL.room)return;SPIL.pause=true;const t0=performance.now(),ctx={alive:true,look:{},room:null,env:scene.environment,mats:new Set(MATS.keys())};
  for(const k of SLOTS)ctx.look[k]=HEKS.L[k];
  ctx.onLook=(k,v)=>{SPIL.look[k]=v;SPIL.save()};
  ctx.ready=()=>{SPIL.roomMs=Math.round(performance.now()-t0);doorEl.classList.add('gone');hjemEl.hidden=false};
  ctx.fail=v=>{if(!v)return;doorT.textContent=v;hjemEl.hidden=false};
  ctx.msg={classList:{add(){ctx.ready()}}};ctx.msgN={set textContent(v){ctx.fail(v)}};
  SPIL.room={d,ctx};document.body.dataset.rum=d.rum;doorT.textContent=`Går ind i ${d.navn} …`;doorEl.classList.remove('gone');rumEl.innerHTML=RUMHTML[d.rum];
  setTimeout(()=>{try{ROOMS[d.rum](ctx)}catch(e){console.error(e);ctx.fail('Fejl: '+e.message)}},320)}
function leave(){const r=SPIL.room;if(!r||r.leaving)return;r.leaving=true;hjemEl.hidden=true;doorT.textContent='Går ud i byen …';doorEl.classList.remove('gone');
  setTimeout(()=>{r.ctx.alive=false;try{if(r.ctx.room)disposeRoom(r.ctx.room,r.ctx.mats)}catch(e){console.error(e)}
    rumEl.innerHTML='';delete document.body.dataset.rum;
    renderer.setRenderTarget(null);renderer.setClearColor('#0d0a12');renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;
    for(const k of SLOTS)if(SPIL.look[k]!==undefined&&HEKS.L[k]!==SPIL.look[k])HEKS.set(k,SPIL.look[k]);
    SPIL.room=null;SPIL.pause=false;if(SPIL.rebake){SPIL.rebake=false;bake()}
    requestAnimationFrame(()=>requestAnimationFrame(()=>doorEl.classList.add('gone')))},320)}
hjemEl.addEventListener('click',leave);
SPIL.arrive=name=>{const d=DOORS[name];if(d)enter(d);else if(HUSNAVN[name])toast(`${HUSNAVN[name]} åbner snart`)};
SPIL.enter=n=>enter(DOORS[n]);SPIL.leave=leave;SPIL.info=()=>Object.assign({programs:renderer.info.programs.length},renderer.info.memory);SPIL.heks=()=>Object.fromEntries(SLOTS.map(k=>[k,HEKS.L[k]]));window.__spil=SPIL;
