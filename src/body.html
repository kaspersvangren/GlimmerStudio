<div id="app">
  <section id="title" class="screen" hidden><div class="title-inner" id="titleBody"></div></section>
  <section id="town" class="screen" hidden><div class="town-inner" id="townBody"></div></section>
  <section id="home" class="screen place" hidden><div class="place-inner" id="homeBody"></div></section>
  <section id="editor" class="screen" hidden>
    <div class="topbar">
      <button id="backBtn" class="btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="backLabel">Garderoben</span></button>
      <input id="nameInput" maxlength="20" aria-label="Dukkens navn" autocomplete="off">
      <span id="gameTheme" class="theme-pill" hidden></span>
      <div class="actions">
        <button id="undoBtn" class="btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Fortryd</button>
        <button id="randBtn" class="btn hot" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.6z"/></svg>Tilfældig</button>
        <button id="doneBtn" class="btn hot" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Færdig!</button>
      </div>
    </div>
    <div class="work">
      <div class="stage-wrap"><div class="mirror" id="mirror"><img id="stageImg" alt="Din dukke"></div></div>
      <div class="panel">
        <div class="modes" role="group" aria-label="Hvad vil du lave">
          <button class="mode" type="button" data-mode="dukke" aria-pressed="true">Dukke</button>
          <button class="mode" type="button" data-mode="dyr" aria-pressed="false">Kæledyr</button>
        </div>
        <nav class="tabs" id="tabs" role="tablist" aria-label="Hvad vil du ændre"></nav>
        <div class="panel-body" id="panelBody"></div>
      </div>
    </div>
  </section>
  <section id="room" class="screen place" hidden><div class="place-inner" id="roomBody"></div></section>
  <section id="balls" class="screen place" hidden><div class="place-inner" id="ballsBody"></div></section>
  <section id="school" class="screen place" hidden><div class="place-inner" id="schoolBody"></div></section>
  <section id="potion" class="screen place" hidden><div class="place-inner" id="potionBody"></div></section>
  <section id="game" class="screen" hidden><div class="screen-inner" id="gameBody"></div></section>
  <div id="modal" class="modal" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p class="hint" id="modalText"></p>
      <div class="row center" id="modalRow"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="curtain" class="curtain" hidden aria-hidden="true"><div class="c-l"></div><div class="c-r"></div></div>
</div>
